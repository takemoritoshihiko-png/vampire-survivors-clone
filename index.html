    drawExtra:(e,ctx)=>{

      ctx.fillRect(e.x-4,e.y-3,3,2);ctx.fillRect(e.x+1,e.y-3,3,2);
    }},
  armorKnight:{name:'Armor Knight',color:'#88a',radius:18,hp:120,speed:40,damage:22,xp:5,
    drawExtra:(e,ctx)=>{
      ctx.strokeStyle='#aac';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.radius-2,0,Math.PI*2);ctx.stroke();
    }},

    move:(e,px,py,dt2)=>{
      const ang=Math.atan2(py-e.y,px-e.x);
      const zigzag=Math.sin(gameTime*4+e.spawnTime*10)*1.5;
      e.x+=Math.cos(ang+zigzag)*e.speed*dt2;

    drawExtra:(e,ctx)=>{

    }},
  demon:{name:'Demon',color:'#f44',radius:14,hp:70,speed:60,damage:18,xp:4,
    move:(e,px,py,dt2)=>{
      const d=distXY(e.x,e.y,px,py);
      const ang=Math.atan2(py-e.y,px-e.x);
      // Charge pattern: slow, then dash
      if(!e.chargeTimer)e.chargeTimer=0;
      e.chargeTimer+=dt2;
      const spd=e.chargeTimer%3<0.5?e.speed*3.5:e.speed;
      e.x+=Math.cos(ang)*spd*dt2;
      e.y+=Math.sin(ang)*spd*dt2;
    },
    drawExtra:(e,ctx)=>{
      // horns
      ctx.fillStyle=e.flashTimer>0?'#fff':'#a00';

  const types=[];

  if(minutes>=7) types.push('armorKnight');
  if(minutes>=12) types.push('ghost');
  if(minutes>=18) types.push('demon');

}

  if(minutes>=12)return'GHOST SWARM';
  if(minutes>=7)return'KNIGHT BATTALION';
  if(minutes>=3)return'SKELETON ARMY';

}

/* ═══════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════ */
function distXY(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function dist(a,b){return distXY(a.x,a.y,b.x,b.y);}
function rnd(a,b){return a+Math.random()*(b-a);}
function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=50+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:0.3+Math.random()*0.4,maxLife:0.5,radius:2+Math.random()*3,color});
  }
}
function spawnDmgPopup(x,y,dmg,isEvolved){
  dmgPopups.push({x:x+rnd(-10,10),y,text:Math.round(dmg)+'',life:0.8,maxLife:0.8,
    color:isEvolved?'#ffd700':'#fff',size:isEvolved?16:12});
}

/* ═══════════════════════════════════════
   WEAPON HELPERS
   ═══════════════════════════════════════ */
function getWeapon(id){return player.weapons.find(w=>w.id===id);}
function getPassive(id){return player.passives.find(p=>p.id===id);}

function getWeaponCd(w){
  const def=WEAPON_DEFS[w.id];
  let cd=def.baseCd*Math.max(0.3,1-(w.lv-1)*0.05);
  cd*=(1-player.cdReduction);
  return Math.max(0.05,cd);
}
function getWeaponDmg(w){
  const def=WEAPON_DEFS[w.id];
  return (def.baseDmg+(w.lv-1)*Math.ceil(def.baseDmg*0.3))*player.might;
}
function getWeaponCount(w){
  const def=WEAPON_DEFS[w.id];
  if(!def.baseCount)return 1;
  return def.baseCount+Math.floor((w.lv-1)*0.5);
}
function getWeaponArea(w){
  const def=WEAPON_DEFS[w.id];
  if(!def.baseArea)return 0;
  return def.baseArea+(w.lv-1)*((w.id==='whip'||w.id==='bloodyTear')?12:10);
}
function isEvolvedWeapon(id){return WEAPON_DEFS[id]&&WEAPON_DEFS[id].evolved;}

/* ═══════════════════════════════════════
   ENEMY SPAWN
   ═══════════════════════════════════════ */
function spawnTypedEnemy(typeId,forceHorde){
  const def=ENEMY_TYPES[typeId];
  if(!def)return;
  const angle=Math.random()*Math.PI*2;
  const d=500+Math.random()*200;
  const tf=Math.min(gameTime/1800,1);
  const hpScale=1+tf*2;
  const e={
    x:player.x+Math.cos(angle)*d,
    y:player.y+Math.sin(angle)*d,
    radius:def.radius,
    hp:def.hp*hpScale,maxHp:def.hp*hpScale,
    speed:def.speed+tf*20,
    damage:def.damage*(1+tf*0.5),
    flashTimer:0,
    color:def.color,
    typeId,
    isBoss:false,
    spawnTime:gameTime,
    xpValue:def.xp,
  };
  enemies.push(e);
}

function spawnBoss(time){
  const def=BOSS_DEFS[time];
  if(!def)return;
  const angle=Math.random()*Math.PI*2;
  const boss={
    x:player.x+Math.cos(angle)*650,
    y:player.y+Math.sin(angle)*650,
    radius:def.radius,hp:def.hp,maxHp:def.hp,
    speed:def.speed,damage:def.damage,
    flashTimer:0,color:def.color,
    isBoss:true,bossName:def.name,
    typeId:'boss',spawnTime:gameTime,
    xpValue:def.xp,
  };
  enemies.push(boss);
  bossActive=boss;
}

function spawnDeath(){
  const angle=Math.random()*Math.PI*2;
  deathEntity={
    x:player.x+Math.cos(angle)*800,
    y:player.y+Math.sin(angle)*800,
    radius:30,speed:45,
  };
}

/* ═══════════════════════════════════════
   APPLY DAMAGE (with popup)
   ═══════════════════════════════════════ */
function applyDamage(e,dmg,weaponId){
  e.hp-=dmg;
  e.flashTimer=0.08;
  spawnParticles(e.x,e.y,'#fff',2);
  spawnDmgPopup(e.x,e.y-e.radius,dmg,isEvolvedWeapon(weaponId));
}

/* ═══════════════════════════════════════
   WEAPON UPDATE
   ═══════════════════════════════════════ */
function updateWeapons(){
  for(const w of player.weapons){
    w.timer+=dt;
    const cd=getWeaponCd(w);
    if(w.timer<cd)continue;
    w.timer=0;
    const dmg=getWeaponDmg(w);
    const def=WEAPON_DEFS[w.id];

    switch(w.id){
      case 'whip':case 'bloodyTear':{
        const area=getWeaponArea(w);
        const ls=def.lifesteal||0;
        for(const dir of[-1,1]){
          whipEffects.push({x:player.x+dir*area*0.5,y:player.y,dir,area,life:0.15,maxLife:0.15,color:def.color});
          for(const e of enemies){
            const ex=e.x-player.x,ey=e.y-player.y;
            if(Math.sqrt(ex*ex+ey*ey)<area&&((dir>0&&ex>=0)||(dir<0&&ex<0))){
              applyDamage(e,dmg,w.id);
              if(ls>0)player.hp=Math.min(player.hp+ls,player.maxHp);
            }
          }
        }
        break;
      }
      case 'fireWand':case 'hellfire':{
        const count=getWeaponCount(w);
        const spd=def.baseSpeed||350;
        for(let i=0;i<count;i++){
          const spread=(i-(count-1)/2)*0.35;
          const base=Math.atan2(playerLastDy,playerLastDx)+spread+rnd(-0.15,0.15);
          bullets.push({x:player.x,y:player.y,radius:6,
            vx:Math.cos(base)*spd,vy:Math.sin(base)*spd,
            damage:dmg,pierce:1,life:2.0,color:def.color,weaponId:w.id});
        }
        break;
      }
      case 'knife':{
        const count=getWeaponCount(w);
        const spd=def.baseSpeed||500;
        const pierce=(def.basePierce||2)+Math.floor((w.lv-1)*0.5);
        for(let i=0;i<count;i++){
          const spread=(i-(count-1)/2)*0.12;
          const ang=Math.atan2(playerLastDy,playerLastDx)+spread;
          bullets.push({x:player.x,y:player.y,radius:4,
            vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
            damage:dmg,pierce,life:1.5,color:'#ddd',weaponId:w.id});
        }
        break;
      }
      case 'garlic':case 'soulEater':{
        const area=getWeaponArea(w);
        for(const e of enemies){
          if(dist(e,player)<area+e.radius) applyDamage(e,dmg,w.id);
        }
        break;
      }
      case 'bible':case 'unholyVespers':break; // handled in updateBibleOrbs
      case 'lightning':{
        const count=getWeaponCount(w);
        let targets=enemies.filter(e=>dist(e,player)<550).sort(()=>Math.random()-0.5).slice(0,count);
        if(targets.length===0)targets=enemies.filter(e=>dist(e,player)<900).slice(0,count);
        for(const e of targets){
          applyDamage(e,dmg,w.id);
          lightningEffects.push({x:e.x,y:e.y,life:0.25,maxLife:0.25});
        }
        break;
      }
    }
  }
}

function updateBibleOrbs(){
  const bw=getWeapon('bible')||getWeapon('unholyVespers');
  if(!bw)return;
  const def=WEAPON_DEFS[bw.id];
  const count=getWeaponCount(bw);
  const orbitR=(def.baseOrbitR||80)+(bw.lv-1)*10;
  const orbitSpd=def.baseOrbitSpeed||3;
  const dmg=getWeaponDmg(bw);

  while(weaponProjectiles.length<count)
    weaponProjectiles.push({angle:weaponProjectiles.length*(Math.PI*2/count),hitCd:{}});
  while(weaponProjectiles.length>count)weaponProjectiles.pop();

  for(const orb of weaponProjectiles){
    orb.angle+=orbitSpd*dt;
    orb.x=player.x+Math.cos(orb.angle)*orbitR;
    orb.y=player.y+Math.sin(orb.angle)*orbitR;
    for(let i=0;i<enemies.length;i++){
      const e=enemies[i];
      if(distXY(orb.x,orb.y,e.x,e.y)<15+e.radius){
        if(!orb.hitCd[i]||orb.hitCd[i]<=0){
          applyDamage(e,dmg,bw.id);
          orb.hitCd[i]=0.25;
        }
      }
    }
    for(const k in orb.hitCd){orb.hitCd[k]-=dt;if(orb.hitCd[k]<=0)delete orb.hitCd[k];}
  }
}

/* ═══════════════════════════════════════
   LEVEL UP CHOICES
   ═══════════════════════════════════════ */
function pickLevelUpChoices(){
  const ch=[];
  // Upgrade existing weapons
  for(const w of player.weapons){
    const def=WEAPON_DEFS[w.id];
    if(w.lv<def.maxLv&&!def.evolved)
      ch.push({type:'weapon',tag:'WEAPON',name:def.name+` Lv${w.lv+1}`,desc:def.desc(w.lv+1),color:def.color,
        apply:()=>{w.lv++;}});
  }
  // New weapons
  if(player.weapons.length<6){
    const owned=new Set(player.weapons.map(w=>w.id));
    for(const id of['whip','fireWand','knife','garlic','bible','lightning']){
      if(!owned.has(id)){
        const def=WEAPON_DEFS[id];
        ch.push({type:'weapon',tag:'NEW WEAPON',name:def.name,desc:def.desc(1),color:def.color,
          apply:()=>{player.weapons.push({id,lv:1,timer:0});}});
      }
    }
  }
  // Passive upgrades
  for(const p of player.passives){
    const def=PASSIVE_DEFS[p.id];
    if(p.lv<def.maxLv)
      ch.push({type:'passive',tag:'PASSIVE',name:def.name+` Lv${p.lv+1}`,desc:def.desc(p.lv+1),color:def.color,
        apply:()=>{p.lv++;def.apply(player,p.lv);}});
  }
  // New passives
  if(player.passives.length<6){
    const owned=new Set(player.passives.map(p=>p.id));
    for(const id of Object.keys(PASSIVE_DEFS)){
      if(!owned.has(id)){
        const def=PASSIVE_DEFS[id];
        ch.push({type:'passive',tag:'NEW PASSIVE',name:def.name,desc:def.desc(1),color:def.color,
          apply:()=>{player.passives.push({id,lv:1});def.apply(player,1);}});
      }
    }
  }
  // Heal
  if(player.hp<player.maxHp*0.9)
    ch.push({type:'heal',tag:'HEAL',name:'Heal',desc:'Recover 30 HP',color:'#4f4',
      apply:()=>{player.hp=Math.min(player.hp+30,player.maxHp);}});

  levelUpChoices=ch.sort(()=>Math.random()-0.5).slice(0,3);
  selectedChoice=-1;
}

/* ═══════════════════════════════════════
   CHEST / EVOLUTION
   ═══════════════════════════════════════ */
const EVOLUTIONS=[
  {weapon:'whip',passive:'hollowHeart',evolved:'bloodyTear'},
  {weapon:'fireWand',passive:'spinach',evolved:'hellfire'},
  {weapon:'garlic',passive:'attractorb',evolved:'soulEater'},
  {weapon:'bible',passive:'emptyTome',evolved:'unholyVespers'},
];

function openChest(){
  for(const evo of EVOLUTIONS){
    const w=getWeapon(evo.weapon);
    const p=getPassive(evo.passive);
    if(w&&w.lv>=8&&p){
      w.id=evo.evolved;w.lv=1;w.timer=0;
      if(evo.evolved==='unholyVespers')weaponProjectiles=[];
      const def=WEAPON_DEFS[evo.evolved];
      chestChoices=[{name:def.name,desc:typeof def.desc==='function'?def.desc():def.desc,color:def.color,evolved:true}];
      state='chest';
      return;
    }
  }
  pickLevelUpChoices();
  state='levelup';
}

/* ═══════════════════════════════════════
   UPDATE
   ═══════════════════════════════════════ */
function update(){
  if(state!=='playing')return;

  // Movement
  let dx=0,dy=0;
  if(keys['w']||keys['W']||keys['ArrowUp'])dy=-1;
  if(keys['s']||keys['S']||keys['ArrowDown'])dy=1;
  if(keys['a']||keys['A']||keys['ArrowLeft']){dx=-1;playerFacing=-1;}
  if(keys['d']||keys['D']||keys['ArrowRight']){dx=1;playerFacing=1;}
  if(dx!==0&&dy!==0){dx*=0.7071;dy*=0.7071;}
  if(dx!==0||dy!==0){playerLastDx=dx;playerLastDy=dy;}
  player.x+=dx*player.speed*dt;
  player.y+=dy*player.speed*dt;

  camera.x=player.x-W/2;
  camera.y=player.y-H/2;

  gameTime+=dt;

  // HP regen
  let regen=player.hpRegen;
  if(getWeapon('soulEater'))regen=Math.max(regen,0.5);
  player.hp=Math.min(player.hp+regen*dt,player.maxHp);

  if(player.invincibleTimer>0)player.invincibleTimer-=dt;

  // Wave events (every minute)
  const curMin=Math.floor(gameTime/60);
  if(curMin!==lastWaveMinute&&gameTime>2){
    lastWaveMinute=curMin;
    const types=getWaveEnemyTypes(curMin);
    waveText='-- '+getWaveName(curMin)+' --';
    waveTextTimer=3;
    // Spawn horde
    const hordeType=types[types.length-1];
    for(let i=0;i<15;i++)spawnTypedEnemy(hordeType,true);
  }
  if(waveTextTimer>0)waveTextTimer-=dt;

  // Boss spawning
  for(const t of BOSS_TIMES){
    if(gameTime>=t&&!bossesSpawned.includes(t)){
      bossesSpawned.push(t);
      spawnBoss(t);
    }
  }

  // Death spawning
  if(gameTime>=DEATH_SPAWN_TIME&&!deathEntity){
    spawnDeath();
    deathWarningTimer=5;
  }
  if(deathWarningTimer>0)deathWarningTimer-=dt;

  // Death movement
  if(deathEntity){
    const ang=Math.atan2(player.y-deathEntity.y,player.x-deathEntity.x);
    deathEntity.x+=Math.cos(ang)*deathEntity.speed*dt;
    deathEntity.y+=Math.sin(ang)*deathEntity.speed*dt;
    if(distXY(deathEntity.x,deathEntity.y,player.x,player.y)<deathEntity.radius+player.radius){
      player.hp=0;state='gameover';return;
    }
  }

  // Weapons
  updateWeapons();
  updateBibleOrbs();

  // Enemy spawning
  const tf=Math.min(gameTime/1800,1);
  const spawnInt=Math.max(0.12,1.2-tf*1.0);
  enemySpawnTimer+=dt;
  while(enemySpawnTimer>=spawnInt){
    enemySpawnTimer-=spawnInt;
    const types=getWaveEnemyTypes(Math.floor(gameTime/60));
    const count=1+Math.floor(tf*2);
    for(let i=0;i<count;i++){
      const typeId=types[Math.floor(Math.random()*types.length)];
      spawnTypedEnemy(typeId);
    }
  }

  // Update bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(dist(b,e)<b.radius+e.radius){
        applyDamage(e,b.damage,b.weaponId);
        b.pierce--;
        if(b.pierce<=0){bullets.splice(i,1);break;}
      }
    }
  }

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    // Custom movement
    const typeDef=ENEMY_TYPES[e.typeId];
    if(typeDef&&typeDef.move){
      typeDef.move(e,player.x,player.y,dt);
    } else {
      const ang=Math.atan2(player.y-e.y,player.x-e.x);
      e.x+=Math.cos(ang)*e.speed*dt;
      e.y+=Math.sin(ang)*e.speed*dt;
    }
    e.flashTimer=Math.max(0,e.flashTimer-dt);

    // Dead
    if(e.hp<=0){
      spawnParticles(e.x,e.y,e.color,e.isBoss?20:6);
      gems.push({x:e.x,y:e.y,radius:e.isBoss?8:5,
        value:e.xpValue||1,bobTimer:Math.random()*Math.PI*2});
      if(Math.random()<(e.isBoss?1:0.08))
        coins.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),radius:4,
          value:e.isBoss?50:(rnd(1,5)|0),bobTimer:Math.random()*Math.PI*2});
      if(e.isBoss){
        chests.push({x:e.x,y:e.y,radius:18,bobTimer:0});
        if(bossActive===e)bossActive=null;
      }
      enemies.splice(i,1);
      continue;
    }

    // Collision
    if(dist(e,player)<e.radius+player.radius){
      if(player.invincibleTimer<=0){
        let dmg=e.damage-player.armor;if(dmg<1)dmg=1;
        player.hp-=dmg;
        player.invincibleTimer=0.5;
        spawnParticles(player.x,player.y,'#f44',5);
        if(player.hp<=0){player.hp=0;state='gameover';return;}
      }
    }
  }

  // Cull far enemies
  enemies=enemies.filter(e=>e.isBoss||dist(e,player)<1200);

  // Gems
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];g.bobTimer+=dt*3;
    const d2=dist(g,player);
    if(d2<player.magnetRange){
      const ang=Math.atan2(player.y-g.y,player.x-g.x);
      g.x+=Math.cos(ang)*350*dt;g.y+=Math.sin(ang)*350*dt;
    }
    if(d2<player.radius+g.radius+5){
      player.xp+=g.value;gems.splice(i,1);
      while(player.xp>=player.xpToNext){
        player.xp-=player.xpToNext;
        player.level++;
        player.xpToNext=Math.floor(player.xpToNext*1.4)+5;
        pendingLevelUps++;
      }
      if(pendingLevelUps>0){
        pendingLevelUps--;pickLevelUpChoices();state='levelup';return;
      }
    }
  }

  // Coins
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];c.bobTimer+=dt*4;
    const d2=dist(c,player);
    if(d2<80){const ang=Math.atan2(player.y-c.y,player.x-c.x);c.x+=Math.cos(ang)*250*dt;c.y+=Math.sin(ang)*250*dt;}
    if(d2<player.radius+c.radius+5){runGold+=c.value;coins.splice(i,1);}
  }

  // Chests
  for(let i=chests.length-1;i>=0;i--){
    const c=chests[i];c.bobTimer+=dt*2;
    if(dist(c,player)<player.radius+c.radius+12){chests.splice(i,1);openChest();return;}
  }

  // Effects decay
  for(let i=lightningEffects.length-1;i>=0;i--){lightningEffects[i].life-=dt;if(lightningEffects[i].life<=0)lightningEffects.splice(i,1);}
  for(let i=whipEffects.length-1;i>=0;i--){whipEffects[i].life-=dt;if(whipEffects[i].life<=0)whipEffects.splice(i,1);}
  for(let i=dmgPopups.length-1;i>=0;i--){dmgPopups[i].life-=dt;dmgPopups[i].y-=60*dt;if(dmgPopups[i].life<=0)dmgPopups.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
}

/* ═══════════════════════════════════════
   DRAW
   ═══════════════════════════════════════ */
function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  if(state==='title'){drawTitle();return;}
  if(state==='shop'){drawShop();return;}

  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  drawGrid();

  // Garlic/SoulEater aura
  const garlicW=getWeapon('garlic')||getWeapon('soulEater');
  if(garlicW){
    const area=getWeaponArea(garlicW);
    const c=WEAPON_DEFS[garlicW.id].color;
    ctx.globalAlpha=0.12;ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(player.x,player.y,area,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.35;ctx.strokeStyle=c;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(player.x,player.y,area,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Whip effects
  for(const w of whipEffects){
    ctx.globalAlpha=(w.life/w.maxLife)*0.45;ctx.fillStyle=w.color;
    ctx.beginPath();ctx.ellipse(w.x,w.y,w.area*0.6,w.area*0.3,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // Chests
  for(const c of chests){
    const bob=Math.sin(c.bobTimer)*3;
    ctx.fillStyle='#fa0';ctx.strokeStyle='#840';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(c.x-14,c.y-12+bob,28,24,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff0';ctx.fillRect(c.x-3,c.y-4+bob,6,8);
    // glow
    ctx.shadowColor='#fa0';ctx.shadowBlur=15;
    ctx.beginPath();ctx.roundRect(c.x-14,c.y-12+bob,28,24,4);ctx.stroke();
    ctx.shadowBlur=0;
  }

  // Gems
  for(const g of gems){
    const bob=Math.sin(g.bobTimer)*3;
    ctx.fillStyle='#0f6';ctx.shadowColor='#0f6';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(g.x,g.y+bob,g.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Coins
  for(const c of coins){
    const bob=Math.sin(c.bobTimer)*2;
    ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(c.x,c.y+bob,c.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#a80';ctx.beginPath();ctx.arc(c.x,c.y+bob,c.radius*0.4,0,Math.PI*2);ctx.fill();
  }

  // Bullets
  for(const b of bullets){
    ctx.fillStyle=b.color||'#ff0';ctx.shadowColor=b.color||'#ff0';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }

  // Bible orbs
  const bibleW=getWeapon('bible')||getWeapon('unholyVespers');
  if(bibleW){
    const c=WEAPON_DEFS[bibleW.id].color;
    for(const orb of weaponProjectiles){
      ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(orb.x,orb.y,11,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';
      ctx.fillText('B',orb.x,orb.y+4);
    }
  }

  // Lightning
  for(const l of lightningEffects){
    const a=l.life/l.maxLife;
    ctx.globalAlpha=a;ctx.strokeStyle='#ff0';ctx.lineWidth=3;
    ctx.beginPath();
    let bx=l.x+rnd(-5,5),by=l.y-280;ctx.moveTo(bx,by);
    for(let s=0;s<6;s++){bx+=rnd(-25,25);by+=47;ctx.lineTo(bx,by);}
    ctx.lineTo(l.x,l.y);ctx.stroke();
    // Flash
    ctx.fillStyle='rgba(255,255,200,0.3)';ctx.beginPath();ctx.arc(l.x,l.y,25*a,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  // Enemies
  for(const e of enemies){
    const typeDef=ENEMY_TYPES[e.typeId];

    // Ghost transparency
    if(e.typeId==='ghost'){ctx.globalAlpha=0.5+Math.sin(gameTime*3)*0.15;}

    if(e.isBoss){
      ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
      ctx.shadowColor=e.color;ctx.shadowBlur=20;
      ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Boss face
      const er=e.radius*0.3;
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(e.x-er,e.y-er*0.5,er*0.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+er,e.y-er*0.5,er*0.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f00';
      ctx.beginPath();ctx.arc(e.x-er,e.y-er*0.5,er*0.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+er,e.y-er*0.5,er*0.2,0,Math.PI*2);ctx.fill();
      // Name
      ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText(e.bossName||'BOSS',e.x,e.y+e.radius+15);
    } else {
      ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
      ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();
      // Type-specific drawing
      if(typeDef&&typeDef.drawExtra)typeDef.drawExtra(e,ctx);
      // HP bar (only if damaged)
      if(e.hp<e.maxHp){
        const hpR=Math.max(0,e.hp/e.maxHp);
        ctx.fillStyle='#333';ctx.fillRect(e.x-15,e.y-e.radius-8,30,3);
        ctx.fillStyle='#f44';ctx.fillRect(e.x-15,e.y-e.radius-8,30*hpR,3);
      }
    }
    ctx.globalAlpha=1;
  }

  // Death entity
  if(deathEntity){
    const d=deathEntity;
    ctx.fillStyle='#000';ctx.shadowColor='#808';ctx.shadowBlur=30;
    ctx.beginPath();ctx.arc(d.x,d.y,d.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Hood shape
    ctx.fillStyle='#202';
    ctx.beginPath();ctx.arc(d.x,d.y-5,d.radius*0.8,Math.PI,0);ctx.fill();
    // Eyes
    ctx.fillStyle='#f00';
    ctx.beginPath();ctx.arc(d.x-8,d.y-5,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(d.x+8,d.y-5,4,0,Math.PI*2);ctx.fill();
    // Scythe
    ctx.strokeStyle='#888';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(d.x+d.radius,d.y-d.radius);ctx.lineTo(d.x-5,d.y+d.radius*0.8);ctx.stroke();
    ctx.strokeStyle='#aaa';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(d.x+d.radius-5,d.y-d.radius+15,18,Math.PI*1.2,Math.PI*1.9);ctx.stroke();
    // Label
    ctx.fillStyle='#f00';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText('DEATH',d.x,d.y+d.radius+20);
  }

  // Player
  const blink=player.invincibleTimer>0&&Math.floor(player.invincibleTimer*10)%2;
  if(!blink){
    const glow=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,player.radius*2.2);
    glow.addColorStop(0,'rgba(100,200,255,0.25)');glow.addColorStop(1,'rgba(100,200,255,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(player.x,player.y,player.radius*2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4af';ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.arc(player.x-5,player.y-4,4,0,Math.PI*2);ctx.arc(player.x+5,player.y-4,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#222';ctx.beginPath();
    ctx.arc(player.x-4+playerFacing*2,player.y-4,2,0,Math.PI*2);
    ctx.arc(player.x+6+playerFacing*2,player.y-4,2,0,Math.PI*2);ctx.fill();
  }

  // Damage popups
  for(const p of dmgPopups){
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;

  // Particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.restore();

  drawHUD();

  if(state==='levelup')drawLevelUp();
  if(state==='chest')drawChest();
  if(state==='paused')drawPaused();
  if(state==='gameover')drawEndScreen('GAME OVER','#f44');
  if(state==='clear')drawEndScreen('YOU SURVIVED!','#0f0');
}

function drawGrid(){
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  const gs=80;
  const sx=Math.floor(camera.x/gs)*gs,sy=Math.floor(camera.y/gs)*gs;
  for(let x=sx;x<camera.x+W+gs;x+=gs){ctx.beginPath();ctx.moveTo(x,camera.y);ctx.lineTo(x,camera.y+H);ctx.stroke();}
  for(let y=sy;y<camera.y+H+gs;y+=gs){ctx.beginPath();ctx.moveTo(camera.x,y);ctx.lineTo(camera.x+W,y);ctx.stroke();}
}

/* ═══════════════════════════════════════
   HUD
   ═══════════════════════════════════════ */
function drawHUD(){
  const SL=78; // slot panel width

  // HP bar
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(SL+5,12,204,22);
  ctx.fillStyle='#333';ctx.fillRect(SL+7,14,200,18);
  const hpR=player.hp/player.maxHp;
  ctx.fillStyle=hpR>0.5?'#4f4':hpR>0.25?'#fa0':'#f44';
  ctx.fillRect(SL+7,14,200*hpR,18);
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`,SL+107,28);

  // Timer
  const mins=Math.floor(gameTime/60),secs=Math.floor(gameTime%60);
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W-115,12,100,28);
  ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.textAlign='center';
  ctx.fillText(`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`,W-65,33);

  // Level
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W/2-45,12,90,24);
  ctx.fillStyle='#ff0';ctx.font='bold 15px monospace';ctx.textAlign='center';
  ctx.fillText(`Lv.${player.level}`,W/2,30);

  // Gold
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W-115,44,100,20);
  ctx.fillStyle='#ff0';ctx.font='11px monospace';ctx.textAlign='center';
  ctx.fillText(`Gold: ${runGold}`,W-65,58);

  // Enemy count
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(SL+5,38,100,18);
  ctx.fillStyle='#f88';ctx.font='11px monospace';ctx.textAlign='left';
  ctx.fillText(`Enemies: ${enemies.length}`,SL+10,51);

  // XP bar
  const xpW=W-SL-30;
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(SL+3,H-32,xpW+4,18);
  ctx.fillStyle='#333';ctx.fillRect(SL+5,H-30,xpW,14);
  ctx.fillStyle='#0af';ctx.fillRect(SL+5,H-30,xpW*(player.xp/player.xpToNext),14);
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText(`XP ${player.xp}/${player.xpToNext}`,(SL+5+W-25)/2,H-20);

  // Boss HP
  if(bossActive&&bossActive.hp>0){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W/2-200,42,400,22);
    ctx.fillStyle='#333';ctx.fillRect(W/2-198,44,396,18);
    const bR=bossActive.hp/bossActive.maxHp;
    ctx.fillStyle=bossActive.color||'#f0f';ctx.fillRect(W/2-198,44,396*bR,18);
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(`${bossActive.bossName||'BOSS'} ${Math.ceil(bossActive.hp)}/${Math.ceil(bossActive.maxHp)}`,W/2,57);
  }

  // Wave text
  if(waveTextTimer>0){
    const a=Math.min(1,waveTextTimer);
    ctx.globalAlpha=a;
    ctx.fillStyle='#f44';ctx.font='bold 24px monospace';ctx.textAlign='center';
    ctx.fillText(waveText,W/2,90);
    ctx.globalAlpha=1;
  }

  // Death warning
  if(deathWarningTimer>0){
    const a=0.5+Math.sin(Date.now()/150)*0.5;
    ctx.globalAlpha=a;
    ctx.fillStyle='#f00';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText('DEATH APPROACHES...',W/2,H/2-100);
    ctx.globalAlpha=1;
  }

  // === LEFT PANEL: Weapons + Passives ===
  const panelX=2,panelY=8;
  const slotH=30,slotW=72;
  // Weapons
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(panelX,panelY,slotW,6*slotH+22);
  ctx.fillStyle='#ff0';ctx.font='bold 9px monospace';ctx.textAlign='left';
  ctx.fillText('WEAPONS',panelX+4,panelY+11);
  for(let i=0;i<6;i++){
    const y=panelY+16+i*slotH;
    const w=player.weapons[i];
    if(w){
      const def=WEAPON_DEFS[w.id];
      ctx.fillStyle=def.color;ctx.globalAlpha=0.7;
      ctx.fillRect(panelX+3,y,slotW-6,slotH-4);ctx.globalAlpha=1;
      ctx.fillStyle='#000';ctx.font='bold 10px monospace';
      ctx.fillText(def.icon,panelX+6,y+11);
      ctx.fillStyle='#fff';ctx.font='8px monospace';
      ctx.fillText(def.evolved?'EVO':`Lv${w.lv}`,panelX+6,y+22);
    } else {
      ctx.strokeStyle='#444';ctx.lineWidth=1;
      ctx.strokeRect(panelX+3,y,slotW-6,slotH-4);
    }
  }
  // Passives
  const passStartY=panelY+16+6*slotH+6;
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(panelX,passStartY-6,slotW,6*slotH+22);
  ctx.fillStyle='#0ff';ctx.font='bold 9px monospace';
  ctx.fillText('PASSIVE',panelX+4,passStartY+5);
  for(let i=0;i<6;i++){
    const y=passStartY+10+i*slotH;
    const p=player.passives[i];
    if(p){
      const def=PASSIVE_DEFS[p.id];
      ctx.fillStyle=def.color;ctx.globalAlpha=0.6;
      ctx.fillRect(panelX+3,y,slotW-6,slotH-4);ctx.globalAlpha=1;
      ctx.fillStyle='#000';ctx.font='bold 10px monospace';
      ctx.fillText(def.icon,panelX+6,y+11);
      ctx.fillStyle='#fff';ctx.font='8px monospace';
      ctx.fillText(`Lv${p.lv}`,panelX+6,y+22);
    } else {
      ctx.strokeStyle='#444';ctx.lineWidth=1;
      ctx.strokeRect(panelX+3,y,slotW-6,slotH-4);
    }
  }

  // ESC hint
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='9px monospace';ctx.textAlign='right';
  ctx.fillText('ESC=Pause',W-10,H-8);
}

/* ═══════════════════════════════════════
   OVERLAYS
   ═══════════════════════════════════════ */
function drawTitle(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  // Decorative particles
  for(let i=0;i<30;i++){
    ctx.fillStyle=`hsla(${(Date.now()/20+i*40)%360},60%,60%,0.15)`;
    const px=((Date.now()/30+i*137)%W),py=((Date.now()/50+i*97)%H);
    ctx.beginPath();ctx.arc(px,py,2+Math.sin(Date.now()/500+i)*2,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#f44';ctx.font='bold 52px monospace';ctx.textAlign='center';
  ctx.fillText('VAMPIRE SURVIVORS',W/2,H/2-120);
  ctx.fillStyle='#888';ctx.font='18px monospace';
  ctx.fillText('CLONE',W/2,H/2-85);
  ctx.fillStyle='#ccc';ctx.font='15px monospace';
  ctx.fillText('WASD / Arrow Keys to move',W/2,H/2-30);
  ctx.fillText('Auto-attack weapons | Survive 30 minutes!',W/2,H/2-5);
  ctx.fillText('Bosses at 10:00, 20:00, 30:00',W/2,H/2+20);
  ctx.fillText('Death arrives after 30:00...',W/2,H/2+45);
  ctx.fillStyle='#ff0';ctx.font='bold 20px monospace';
  ctx.globalAlpha=0.6+Math.sin(Date.now()/300)*0.4;
  ctx.fillText('Press SPACE / ENTER to start',W/2,H/2+100);
  ctx.globalAlpha=1;
  // Shop
  ctx.fillStyle='rgba(255,200,0,0.25)';
  ctx.beginPath();ctx.roundRect(W/2-90,H/2+130,180,42,8);ctx.fill();
  ctx.strokeStyle='#fa0';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(W/2-90,H/2+130,180,42,8);ctx.stroke();
  ctx.fillStyle='#ff0';ctx.font='bold 16px monospace';
  ctx.fillText(`SHOP (${shop.gold}g)`,W/2,H/2+157);
}

function drawLevelUp(){
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ff0';ctx.font='bold 32px monospace';ctx.textAlign='center';
  ctx.fillText('LEVEL UP!',W/2,120);
  ctx.fillStyle='#ccc';ctx.font='13px monospace';
  ctx.fillText('Choose (1, 2, 3) or click',W/2,148);
  if(pendingLevelUps>0){ctx.fillStyle='#fa0';ctx.font='11px monospace';ctx.fillText(`+${pendingLevelUps} pending`,W/2,165);}

  for(let i=0;i<levelUpChoices.length;i++){
    const c=levelUpChoices[i];
    const bx=W/2-270+i*190,by=185,bw=170,bh=230;
    const hover=selectedChoice===i;
    ctx.fillStyle=hover?'rgba(100,180,255,0.35)':'rgba(40,40,70,0.92)';
    ctx.strokeStyle=hover?'#4af':'#555';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();ctx.stroke();
    // Tag
    const tagColor=c.type==='weapon'?'#f80':c.type==='passive'?'#0af':'#4f4';
    ctx.fillStyle=tagColor;ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText(c.tag||'',bx+bw/2,by+18);
    // Number
    ctx.fillStyle='#ff0';ctx.font='bold 22px monospace';
    ctx.fillText(`${i+1}`,bx+bw/2,by+44);
    // Color bar
    ctx.fillStyle=c.color||'#fff';ctx.fillRect(bx+20,by+52,bw-40,3);
    // Name
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';
    wrapText(c.name,bx+bw/2,by+78,bw-16,16);
    // Desc
    ctx.fillStyle='#aaa';ctx.font='11px monospace';
    wrapText(c.desc,bx+bw/2,by+120,bw-16,14);
  }
}

function drawChest(){
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fa0';ctx.font='bold 34px monospace';ctx.textAlign='center';
  ctx.fillText('TREASURE CHEST!',W/2,190);
  if(chestChoices.length>0&&chestChoices[0].evolved){
    ctx.fillStyle='#f0f';ctx.font='bold 26px monospace';
    ctx.fillText('WEAPON EVOLVED!',W/2,250);
    ctx.fillStyle=chestChoices[0].color;ctx.font='bold 20px monospace';
    ctx.fillText(chestChoices[0].name,W/2,300);
    ctx.fillStyle='#aaa';ctx.font='14px monospace';
    ctx.fillText(chestChoices[0].desc,W/2,335);
  }
  ctx.fillStyle='#ff0';ctx.font='bold 16px monospace';
  ctx.globalAlpha=0.6+Math.sin(Date.now()/300)*0.4;
  ctx.fillText('Press SPACE to continue',W/2,430);
  ctx.globalAlpha=1;
}

function drawPaused(){
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 36px monospace';ctx.textAlign='center';
  ctx.fillText('PAUSED',W/2,120);

  // Build summary
  let y=170;
  ctx.fillStyle='#ff0';ctx.font='bold 14px monospace';
  ctx.fillText('-- WEAPONS --',W/2,y);y+=25;
  for(const w of player.weapons){
    const def=WEAPON_DEFS[w.id];
    ctx.fillStyle=def.color;ctx.font='13px monospace';
    ctx.fillText(`${def.name} ${def.evolved?'(EVOLVED)':`Lv${w.lv}`}`,W/2,y);y+=20;
  }
  y+=10;
  ctx.fillStyle='#0ff';ctx.font='bold 14px monospace';
  ctx.fillText('-- PASSIVES --',W/2,y);y+=25;
  for(const p of player.passives){
    const def=PASSIVE_DEFS[p.id];
    ctx.fillStyle=def.color;ctx.font='13px monospace';
    ctx.fillText(`${def.name} Lv${p.lv}`,W/2,y);y+=20;
  }
  y+=20;
  ctx.fillStyle='#fff';ctx.font='13px monospace';
  ctx.fillText(`ATK: x${player.might.toFixed(2)}  Armor: ${player.armor}  Speed: ${Math.round(player.speed)}`,W/2,y);y+=18;
  ctx.fillText(`CD Red: ${Math.round(player.cdReduction*100)}%  Magnet: ${Math.round(player.magnetRange)}`,W/2,y);y+=18;
  ctx.fillText(`HP Regen: ${(getWeapon('soulEater')?0.5:player.hpRegen).toFixed(1)}/s`,W/2,y);

  ctx.fillStyle='#888';ctx.font='14px monospace';
  ctx.fillText('Press ESC to resume',W/2,H-50);
}

function drawEndScreen(title,color){
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=color;ctx.font='bold 46px monospace';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-80);
  ctx.fillStyle='#fff';ctx.font='16px monospace';
  const mins=Math.floor(gameTime/60),secs=Math.floor(gameTime%60);
  ctx.fillText(`Survived: ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}  Level: ${player.level}`,W/2,H/2-30);
  ctx.fillStyle='#ff0';ctx.font='15px monospace';
  ctx.fillText(`Gold earned: ${runGold}  (Total: ${shop.gold+runGold})`,W/2,H/2+5);
  // Weapons summary
  ctx.fillStyle='#aaa';ctx.font='12px monospace';
  const wNames=player.weapons.map(w=>WEAPON_DEFS[w.id].name).join(', ');
  ctx.fillText(`Weapons: ${wNames||'None'}`,W/2,H/2+35);
  ctx.fillStyle='#ff0';ctx.font='bold 20px monospace';
  ctx.globalAlpha=0.6+Math.sin(Date.now()/300)*0.4;
  ctx.fillText('Press SPACE / ENTER to continue',W/2,H/2+90);
  ctx.globalAlpha=1;
}

function drawShop(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fa0';ctx.font='bold 36px monospace';ctx.textAlign='center';
  ctx.fillText('SHOP',W/2,70);
  ctx.fillStyle='#ff0';ctx.font='16px monospace';
  ctx.fillText(`Gold: ${shop.gold}`,W/2,100);

  for(let i=0;i<shopItems.length;i++){
    const item=shopItems[i];
    const bx=W/2-210,by=125+i*70,bw=420,bh=58;
    const owned=shop[item.key]||0;
    const canBuy=shop.gold>=item.cost;
    const hover=shopSelectedItem===i;
    ctx.fillStyle=hover?'rgba(100,180,255,0.25)':'rgba(40,40,70,0.85)';
    ctx.strokeStyle=hover?(canBuy?'#4f4':'#f44'):'#555';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='left';
    ctx.fillText(`${i+1}. ${item.name}`,bx+12,by+22);
    ctx.fillStyle='#aaa';ctx.font='11px monospace';
    ctx.fillText(item.desc,bx+12,by+42);
    ctx.fillStyle=canBuy?'#ff0':'#666';ctx.font='bold 13px monospace';ctx.textAlign='right';
    ctx.fillText(`${item.cost}g  [x${owned}]`,bx+bw-12,by+32);
  }

  ctx.fillStyle='#666';ctx.font='14px monospace';ctx.textAlign='center';
  ctx.fillText(`Press 1-${shopItems.length} to buy, ESC/SPACE to return`,W/2,H-50);
}

function wrapText(text,x,y,maxW,lh){
  const words=text.split(' ');let line='',ty=y;
  for(const w of words){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line.trim(),x,ty);line=w+' ';ty+=lh;}
    else line=test;
  }
  ctx.fillText(line.trim(),x,ty);
}

/* ═══════════════════════════════════════
   INPUT HANDLING
   ═══════════════════════════════════════ */
window.addEventListener('keydown',e=>{
  if(state==='title'){
    if(e.key===' '||e.key==='Enter'){resetGame();state='playing';}
  }else if(state==='playing'){
    if(e.key==='Escape'){state='paused';}
  }else if(state==='paused'){
    if(e.key==='Escape'){state='playing';}
  }else if(state==='levelup'){
    if(e.key>='1'&&e.key<='3'){
      const idx=parseInt(e.key)-1;
      if(idx<levelUpChoices.length){
        levelUpChoices[idx].apply();
        if(pendingLevelUps>0){pendingLevelUps--;pickLevelUpChoices();}
        else state='playing';
      }
    }
  }else if(state==='chest'){
    if(e.key===' '||e.key==='Enter')state='playing';
  }else if(state==='gameover'||state==='clear'){
    if(e.key===' '||e.key==='Enter'){shop.gold+=runGold;saveShop();state='title';}
  }else if(state==='shop'){
    if(e.key==='Escape'||e.key===' ')state='title';
    const n=parseInt(e.key);
    if(n>=1&&n<=shopItems.length){
      const item=shopItems[n-1];
      if(shop.gold>=item.cost){shop.gold-=item.cost;shop[item.key]=(shop[item.key]||0)+1;saveShop();}
    }
  }
});

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const sx=W/rect.width,sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;

  if(state==='title'){
    if(mx>=W/2-90&&mx<=W/2+90&&my>=H/2+130&&my<=H/2+172){state='shop';return;}
    resetGame();state='playing';
  }else if(state==='levelup'){
    for(let i=0;i<levelUpChoices.length;i++){
      const bx=W/2-270+i*190,by=185;
      if(mx>=bx&&mx<=bx+170&&my>=by&&my<=by+230){
        levelUpChoices[i].apply();
        if(pendingLevelUps>0){pendingLevelUps--;pickLevelUpChoices();}
        else state='playing';
        break;
      }
    }
  }else if(state==='chest'){state='playing';
  }else if(state==='paused'){state='playing';
  }else if(state==='gameover'||state==='clear'){shop.gold+=runGold;saveShop();state='title';
  }else if(state==='shop'){
    for(let i=0;i<shopItems.length;i++){
      const bx=W/2-210,by=125+i*70;
      if(mx>=bx&&mx<=bx+420&&my>=by&&my<=by+58){
        const item=shopItems[i];
        if(shop.gold>=item.cost){shop.gold-=item.cost;shop[item.key]=(shop[item.key]||0)+1;saveShop();}
        break;
      }
    }
  }
});

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const sx=W/rect.width,sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  if(state==='levelup'){
    selectedChoice=-1;
    for(let i=0;i<levelUpChoices.length;i++){
      const bx=W/2-270+i*190,by=185;
      if(mx>=bx&&mx<=bx+170&&my>=by&&my<=by+230){selectedChoice=i;break;}
    }
  }else if(state==='shop'){
    shopSelectedItem=-1;
    for(let i=0;i<shopItems.length;i++){
      const bx=W/2-210,by=125+i*70;
      if(mx>=bx&&mx<=bx+420&&my>=by&&my<=by+58){shopSelectedItem=i;break;}
    }
  }
});

/* ═══════════════════════════════════════
   GAME LOOP
   ═══════════════════════════════════════ */
function gameLoop(ts){
  if(lastTime===0)lastTime=ts;
  dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  update();draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
