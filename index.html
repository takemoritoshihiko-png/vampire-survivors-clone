<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dada Survivor Complete</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',sans-serif}
body{background:#0a0a1a;color:#fff;overflow:hidden;height:100vh;width:100vw;position:fixed}
.screen{display:none;position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto}
.screen.active{display:flex;flex-direction:column}
canvas{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges}
img{image-rendering:pixelated;image-rendering:crisp-edges}

/* ─── HOME ─── */
#home{background:linear-gradient(135deg,#0a0a2e,#1a0a2e,#0a1a2e);align-items:center;padding:14px 14px 100px}
.home-title{font-size:30px;font-weight:bold;color:#f80;text-shadow:0 0 24px #f80;margin:6px 0;letter-spacing:2px}
.coin-bar{background:rgba(0,0,0,.5);padding:8px 18px;border-radius:20px;border:2px solid #fa0;margin-bottom:8px;font-size:18px;font-weight:bold;color:#ff0;text-shadow:0 0 8px #fa0}
.home-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0;width:100%;max-width:980px}
.home-card{background:rgba(255,255,255,.06);border:1px solid #333;border-radius:12px;padding:12px;min-width:160px;flex:1;max-width:230px;text-align:center;cursor:pointer;transition:all .15s}
.home-card:hover{border-color:#f80;background:rgba(255,200,0,.08);transform:translateY(-2px)}
.home-card.selected{border-color:#f80;box-shadow:0 0 14px rgba(255,136,0,.5)}
.home-card .big-icon{font-size:50px;line-height:1.2;margin-bottom:4px}
.home-card img{display:block;margin:0 auto 6px}
.home-card h3{font-size:16px;margin-bottom:4px}
.home-card p{font-size:11px;color:#aaa;line-height:1.3}
.home-card .stats{font-size:11px;color:#4af;margin:4px 0;font-weight:bold}
.btn{padding:9px 22px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .15s;color:#fff}
.btn:hover{transform:scale(1.05);filter:brightness(1.2)}
.btn-orange{background:linear-gradient(135deg,#f80,#f50)}
.btn-blue{background:linear-gradient(135deg,#28f,#06f)}
.btn-green{background:linear-gradient(135deg,#0a0,#080)}
.btn-purple{background:linear-gradient(135deg,#a0f,#80f)}
.btn-red{background:linear-gradient(135deg,#f44,#d22)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.tab-bar{display:flex;gap:4px;margin:8px 0 0;flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}
.tab-bar button{padding:8px 14px;border:1px solid #444;background:rgba(255,255,255,.05);border-radius:8px 8px 0 0;color:#aaa;cursor:pointer;font-size:12px;font-weight:bold}
.tab-bar button.active{background:rgba(255,255,255,.13);color:#fff;border-bottom-color:transparent}
.panel{background:rgba(0,0,0,.35);border:1px solid #333;border-radius:0 12px 12px 12px;padding:14px;width:100%;max-width:980px;min-height:240px}

/* Floating BATTLE button */
#battleBtn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f80,#f33);color:#fff;border:none;padding:14px 60px;font-size:22px;font-weight:bold;border-radius:14px;cursor:pointer;box-shadow:0 6px 24px rgba(255,80,0,.6);z-index:50;letter-spacing:2px;animation:battlePulse 2s infinite}
#battleBtn:hover{transform:translateX(-50%)scale(1.05)}
@keyframes battlePulse{0%,100%{box-shadow:0 6px 24px rgba(255,80,0,.6)}50%{box-shadow:0 6px 36px rgba(255,140,0,.9)}}

/* Equipment grid */
.equip-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.inv-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:430px;margin:0 auto}
.equip-slot{width:74px;height:80px;border:2px solid #444;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;cursor:pointer;position:relative;transition:all .15s;padding:3px}
.equip-slot:hover{border-color:#fff;transform:scale(1.08);z-index:5}
.equip-slot .eq-icon{font-size:24px;line-height:1}
.rank-gray{border-color:#888;background:rgba(120,120,120,.18)}
.rank-green{border-color:#44ff44;background:rgba(0,200,0,.18);box-shadow:0 0 8px rgba(68,255,68,.27)}
.rank-blue{border-color:#4488ff;background:rgba(0,140,255,.18);box-shadow:0 0 8px rgba(68,136,255,.27)}
.rank-purple{border-color:#aa44ff;background:rgba(180,80,255,.20);box-shadow:0 0 8px rgba(170,68,255,.27)}
.rank-gold{border-color:#fc0;background:rgba(255,180,0,.22);box-shadow:0 0 12px rgba(255,204,0,.4);animation:gold-shine 2s infinite}
.rank-red{border-color:#f22;background:rgba(255,40,40,.25);box-shadow:0 0 16px rgba(255,34,34,.4);animation:red-pulse 1.5s infinite}
@keyframes gold-shine{0%,100%{box-shadow:0 0 12px rgba(255,204,0,.4)}50%{box-shadow:0 0 24px rgba(255,204,0,.67)}}
@keyframes red-pulse{0%,100%{box-shadow:0 0 16px rgba(255,34,34,.4)}50%{box-shadow:0 0 32px rgba(255,34,34,.67)}}

/* Common card */
.game-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid #333;border-radius:12px;padding:16px;margin:8px;transition:transform .1s,border-color .2s}
.game-card:active{transform:scale(.97)}

/* Number rise */
.number-up{display:inline-block;animation:number-rise .5s ease-out;color:#44ff44}
@keyframes number-rise{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* Result confetti */
@keyframes confettiFall{0%{transform:translateY(-30px)rotate(0);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;top:-20px;width:10px;height:14px;pointer-events:none;z-index:5;animation:confettiFall linear forwards}

/* Result frames */
.result-clear{border:4px solid #fc0!important;box-shadow:0 0 40px rgba(255,204,0,.7),inset 0 0 30px rgba(255,204,0,.2)!important;animation:gold-shine 2s infinite}
.result-over{border:4px solid #f22!important;box-shadow:0 0 40px rgba(255,34,34,.6),inset 0 0 30px rgba(0,0,0,.6)!important}
#result.gameover-bg{background:radial-gradient(circle,#1a0000,#000)!important}
#result.clear-bg{background:radial-gradient(circle,#1a1a2e,#0a0a1a)!important}

/* Daily / Records */
.mission-row{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid #333;border-radius:8px;padding:10px;margin:6px 0;gap:10px}
.mission-row.done{border-color:#0a0;background:rgba(0,160,0,.1)}
.mission-row .mi{font-size:30px}
.mission-row .info{flex:1}
.mission-row .info b{font-size:14px;display:block}
.mission-row .info p{font-size:11px;color:#aaa}
.bar-bg{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;background:linear-gradient(90deg,#0a0,#0f0);transition:width .3s}

/* Result */
#result{background:linear-gradient(135deg,#0a0a2e,#1a0a2e);align-items:center;justify-content:center;padding:20px}
.result-box{background:rgba(0,0,0,.5);border:2px solid #444;border-radius:18px;padding:28px;text-align:center;max-width:560px;width:100%}
.result-box h2{font-size:28px;margin-bottom:14px}
.result-box .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #222;font-size:14px}
.result-box .stat-row span:last-child{color:#ff0;font-weight:bold}
.result-btns{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.dropped-eq{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.dropped-eq .equip-slot{width:54px;height:60px}
.dropped-eq .equip-slot .eq-icon{font-size:20px}

/* Chapter */
.chapter-card{min-width:200px;padding:18px;text-align:center}
.chapter-card.locked{opacity:.45}

/* Gacha popup */
#gachaPopup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:20px;overflow-y:auto}
#gachaPopup.show{display:flex}
.gacha-popup-title{font-size:34px;color:#fa0;text-shadow:0 0 20px #fa0;margin-bottom:16px;font-weight:bold;letter-spacing:2px;animation:gachaTitle .6s}
@keyframes gachaTitle{from{transform:scale(0)rotate(-180deg);opacity:0}to{transform:scale(1)rotate(0);opacity:1}}
.gacha-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:600px;margin:14px}
.gacha-card{width:104px;height:138px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;animation:cardFlip .55s ease-out backwards;border-width:3px;border-style:solid;padding:6px}
.gacha-card .gc-icon{font-size:34px}
.gacha-card .gc-rank{font-weight:bold;font-size:12px;margin-top:5px}
.gacha-card .gc-slot{font-size:10px;color:#ddd}
@keyframes cardFlip{0%{transform:rotateY(180deg)scale(0);opacity:0}55%{transform:rotateY(-15deg)scale(1.15);opacity:1}100%{transform:rotateY(0)scale(1);opacity:1}}
.gacha-card:nth-child(1){animation-delay:0s}
.gacha-card:nth-child(2){animation-delay:.07s}
.gacha-card:nth-child(3){animation-delay:.14s}
.gacha-card:nth-child(4){animation-delay:.21s}
.gacha-card:nth-child(5){animation-delay:.28s}
.gacha-card:nth-child(6){animation-delay:.35s}
.gacha-card:nth-child(7){animation-delay:.42s}
.gacha-card:nth-child(8){animation-delay:.49s}
.gacha-card:nth-child(9){animation-delay:.56s}
.gacha-card:nth-child(10){animation-delay:.63s}

#rarityFlash{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:99;transition:opacity .25s}
#rarityFlash.flash{animation:rarityFlash .8s}
@keyframes rarityFlash{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}

#legendaryText{position:fixed;top:35%;left:50%;transform:translateX(-50%);font-size:60px;font-weight:bold;color:#f44;text-shadow:0 0 30px #f00,0 0 60px #f00;pointer-events:none;display:none;z-index:101;letter-spacing:4px}
#legendaryText.show{display:block;animation:legPop 1.2s}
@keyframes legPop{0%{transform:translateX(-50%)scale(0)rotate(-15deg);opacity:0}50%{transform:translateX(-50%)scale(1.2)rotate(5deg);opacity:1}100%{transform:translateX(-50%)scale(1)rotate(0);opacity:1}}

/* Rank-up + astral animations */
@keyframes rankFlash{0%{opacity:0}25%{opacity:.7}100%{opacity:0}}
@keyframes rankUpText{0%{transform:translateX(-50%)scale(0)rotate(-15deg);opacity:0}40%{transform:translateX(-50%)scale(1.3)rotate(5deg);opacity:1}100%{transform:translateX(-50%)scale(1)rotate(0);opacity:0}}
@keyframes astralFlash{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}
@keyframes astralText{0%{transform:translateX(-50%)scale(0);opacity:0;letter-spacing:0px}50%{transform:translateX(-50%)scale(1.2);opacity:1;letter-spacing:8px}100%{transform:translateX(-50%)scale(1);opacity:0;letter-spacing:6px}}
@keyframes starFall{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(120vh)rotate(360deg);opacity:0}}

/* Equipment action menu */
#eqMenu{position:fixed;background:rgba(20,20,40,.97);border:2px solid #fa0;border-radius:10px;padding:10px;display:none;z-index:90;box-shadow:0 6px 30px rgba(0,0,0,.7)}
#eqMenu.show{display:block}
#eqMenu button{display:block;width:100%;margin:4px 0;padding:8px 14px;border-radius:6px;border:none;color:#fff;cursor:pointer;font-size:13px;font-weight:bold}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="home" class="screen active">
  <div class="home-title">DADA SURVIVOR</div>
  <div class="coin-bar" id="coinDisplay">💰 0 Coins</div>
  <div class="tab-bar" id="homeTabs"></div>
  <div class="panel" id="homePanel"></div>
</div>
<button id="battleBtn" onclick="startBattle()">⚔ BATTLE ⚔</button>

<!-- ═══ BATTLE ═══ -->
<div id="battle" class="screen">
  <canvas id="game" width="1280" height="720"></canvas>
  <button id="muteBtn" onclick="audioToggleMute()" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);border:1px solid #555;color:#fff;font-size:20px;width:38px;height:38px;border-radius:8px;cursor:pointer;z-index:10">🔊</button>
  <div id="joystickArea" style="position:absolute;bottom:20px;left:20px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);display:none">
    <div id="joystickKnob" style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);position:absolute;top:45px;left:45px"></div>
  </div>
</div>

<!-- ═══ RESULT ═══ -->
<div id="result" class="screen"></div>

<!-- Gacha popup -->
<div id="gachaPopup">
  <div class="gacha-popup-title" id="gachaPopupTitle">✨ GACHA RESULT ✨</div>
  <div class="gacha-cards" id="gachaCards"></div>
  <button class="btn btn-orange" onclick="closeGachaPopup()" style="margin-top:18px">CONTINUE</button>
</div>
<div id="rarityFlash"></div>
<div id="legendaryText">🎉 LEGENDARY! 🎉</div>
<div id="eqMenu"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   SPRITE PRELOAD
   ═══════════════════════════════════════════════════════ */
const SPRITES={};
const SPRITE_FILES={
  char_common:'assets/char_common.png',char_archer:'assets/char_archer.png',char_knight:'assets/char_knight.png',
  enemy_zombie:'assets/enemy_zombie.png',enemy_skeleton:'assets/enemy_skeleton.png',enemy_armorZombie:'assets/enemy_armorZombie.png',
  enemy_ghost:'assets/enemy_ghost.png',enemy_demon:'assets/enemy_demon.png',
  pet_hachiko:'assets/pet_hachiko.png',pet_frog:'assets/pet_frog.png',
  boss_zombie:'assets/boss_zombie.png',
  weapon_kunai:'assets/weapon_kunai.png',weapon_bow:'assets/weapon_bow.png',weapon_sword:'assets/weapon_sword.png',
  weapon_garlic:'assets/weapon_garlic.png',weapon_bible:'assets/weapon_bible.png',weapon_lightning:'assets/weapon_lightning.png',
  weapon_katana:'assets/weapon_katana.png',weapon_shotgun:'assets/weapon_shotgun.png',weapon_drill:'assets/weapon_drill.png',
  weapon_soccer:'assets/weapon_soccer.png',weapon_lightchaser:'assets/weapon_lightchaser.png',weapon_force:'assets/weapon_force.png',
  weapon_chaos:'assets/weapon_chaos.png',weapon_lightchaser_s:'assets/weapon_lightchaser_s.png',weapon_force_s:'assets/weapon_force_s.png',
};
let spritesLoaded=0,spritesTotal=Object.keys(SPRITE_FILES).length;
function preloadSprites(cb){
  for(const[k,src]of Object.entries(SPRITE_FILES)){
    const img=new Image();
    img.onload=()=>{SPRITES[k]=img;if(++spritesLoaded===spritesTotal)cb();};
    img.onerror=()=>{SPRITES[k]=null;if(++spritesLoaded===spritesTotal)cb();};
    img.src=src;
  }
}

/* ═══════════════════════════════════════════════════════
   AUDIO (Web Audio - lazy init on first user gesture)
   ═══════════════════════════════════════════════════════ */
const AUDIO={ctx:null,muted:false,bgmNodes:[],bgmTimer:null,master:null};
function audioInit(){
  if(AUDIO.ctx)return;
  try{
    AUDIO.ctx=new(window.AudioContext||window.webkitAudioContext)();
    AUDIO.master=AUDIO.ctx.createGain();
    AUDIO.master.gain.value=AUDIO.muted?0:0.3;
    AUDIO.master.connect(AUDIO.ctx.destination);
  }catch(e){AUDIO.ctx=null;}
}
function audioToggleMute(){
  AUDIO.muted=!AUDIO.muted;
  if(AUDIO.master)AUDIO.master.gain.value=AUDIO.muted?0:(AUDIO.bossPlaying?0.06:0.3);
  if(AUDIO.bossBGM)AUDIO.bossBGM.muted=AUDIO.muted;
  const b=document.getElementById('muteBtn');if(b)b.textContent=AUDIO.muted?'🔇':'🔊';
  try{localStorage.setItem('dada_muted',AUDIO.muted?'1':'0');}catch(e){}
}
try{AUDIO.muted=localStorage.getItem('dada_muted')==='1';}catch(e){}

function playTone(freq,dur,type,gain,when){
  if(!AUDIO.ctx||AUDIO.muted)return;
  const t=when||AUDIO.ctx.currentTime;
  const osc=AUDIO.ctx.createOscillator();const g=AUDIO.ctx.createGain();
  osc.type=type||'sine';osc.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(g);g.connect(AUDIO.master);
  osc.start(t);osc.stop(t+dur+0.05);
}
function playNoise(dur,gain,filterFreq){
  if(!AUDIO.ctx||AUDIO.muted)return;
  const t=AUDIO.ctx.currentTime;
  const buf=AUDIO.ctx.createBuffer(1,AUDIO.ctx.sampleRate*dur,AUDIO.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=AUDIO.ctx.createBufferSource();src.buffer=buf;
  const g=AUDIO.ctx.createGain();g.gain.value=gain||0.15;
  const filt=AUDIO.ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=filterFreq||2000;
  src.connect(filt);filt.connect(g);g.connect(AUDIO.master);src.start(t);
}

const SFX={
  hit(){playNoise(0.05,0.08,3000);},
  levelUp(){if(!AUDIO.ctx)return;const t=AUDIO.ctx.currentTime;[523,659,784,1047].forEach((f,i)=>playTone(f,0.18,'square',0.18,t+i*0.06));},
  evolution(){if(!AUDIO.ctx)return;const t=AUDIO.ctx.currentTime;[392,494,587,784,988].forEach((f,i)=>{playTone(f,0.4,'sawtooth',0.16,t+i*0.04);playTone(f*2,0.4,'sine',0.10,t+i*0.04);});},
  bossSpawn(){if(!AUDIO.ctx)return;const t=AUDIO.ctx.currentTime;playTone(50,0.8,'sawtooth',0.3,t);playTone(75,0.8,'square',0.18,t+0.1);},
  coin(){playTone(1320,0.06,'square',0.10);setTimeout(()=>playTone(1760,0.06,'square',0.10),50);},
  death(){if(!AUDIO.ctx)return;const t=AUDIO.ctx.currentTime;[523,440,349,262,196].forEach((f,i)=>playTone(f,0.25,'sawtooth',0.20,t+i*0.10));},
  gacha(){if(!AUDIO.ctx)return;const t=AUDIO.ctx.currentTime;for(let i=0;i<5;i++)playTone(440+Math.random()*880,0.10,'square',0.13,t+i*0.05);},
  damage(){playNoise(0.12,0.18,800);},
};

/* BGM: procedural per chapter */
function bgmStop(){
  if(AUDIO.bgmTimer){clearInterval(AUDIO.bgmTimer);AUDIO.bgmTimer=null;}
  for(const n of AUDIO.bgmNodes){try{n.stop();}catch(e){}try{n.disconnect();}catch(e){}}
  AUDIO.bgmNodes=[];
  // Also stop boss BGM if active
  bgmStopBoss(true);
}

/* Boss BGM: HTMLAudio file, fades in/out over chapter BGM */
AUDIO.bossBGM=null;AUDIO.bossPlaying=false;AUDIO.savedChapter=null;
AUDIO.fadeTimers=[];
function bgmAudioFade(audio,from,to,dur,done){
  if(!audio)return;
  const steps=30,intv=dur/steps;let i=0;
  audio.volume=Math.max(0,Math.min(1,from));
  const t=setInterval(()=>{
    i++;
    audio.volume=Math.max(0,Math.min(1,from+(to-from)*(i/steps)));
    if(i>=steps){clearInterval(t);AUDIO.fadeTimers=AUDIO.fadeTimers.filter(x=>x!==t);if(done)done();}
  },intv);
  AUDIO.fadeTimers.push(t);
}
function bgmInitBoss(){
  if(AUDIO.bossBGM)return;
  try{
    const a=new Audio('assets/bgm/Steel_Against_Gravity.mp3');
    a.loop=true;a.volume=0;a.preload='auto';
    a.addEventListener('error',()=>{AUDIO.bossBGM=null;});
    AUDIO.bossBGM=a;
  }catch(e){AUDIO.bossBGM=null;}
}
function bgmStartBoss(chap){
  if(AUDIO.muted)return;
  bgmInitBoss();
  if(!AUDIO.bossBGM)return;
  if(AUDIO.bossPlaying)return;
  AUDIO.bossPlaying=true;
  AUDIO.savedChapter=chap||AUDIO.savedChapter;
  // Fade out chapter BGM volume via master? Cleaner: stop chapter BGM cleanly
  if(AUDIO.master){
    const startVol=AUDIO.master.gain.value;
    const t=AUDIO.ctx.currentTime;
    AUDIO.master.gain.cancelScheduledValues(t);
    AUDIO.master.gain.setValueAtTime(startVol,t);
    AUDIO.master.gain.linearRampToValueAtTime(0.06,t+1.0);
  }
  // Fade in boss track
  try{AUDIO.bossBGM.currentTime=0;}catch(e){}
  const p=AUDIO.bossBGM.play();
  if(p&&p.catch)p.catch(()=>{});
  bgmAudioFade(AUDIO.bossBGM,0,0.7,1500);
}
function bgmStopBoss(silent){
  if(!AUDIO.bossPlaying){if(AUDIO.bossBGM){try{AUDIO.bossBGM.pause();}catch(e){}}return;}
  AUDIO.bossPlaying=false;
  // Fade out boss track and resume chapter master volume
  bgmAudioFade(AUDIO.bossBGM,AUDIO.bossBGM.volume,0,silent?200:1500,()=>{
    try{AUDIO.bossBGM.pause();}catch(e){}
  });
  if(AUDIO.master&&!silent){
    const t=AUDIO.ctx.currentTime;
    AUDIO.master.gain.cancelScheduledValues(t);
    AUDIO.master.gain.setValueAtTime(AUDIO.master.gain.value,t);
    AUDIO.master.gain.linearRampToValueAtTime(AUDIO.muted?0:0.3,t+1.5);
  } else if(AUDIO.master&&silent){
    AUDIO.master.gain.value=AUDIO.muted?0:0.3;
  }
}
function bgmStart(chap){
  if(!AUDIO.ctx)return;
  bgmStop();
  if(chap===1){
    const notes=[523.25,659.25,783.99,880,783.99,659.25,523.25,440];
    let i=0;
    const tick=()=>{
      if(AUDIO.muted||!AUDIO.ctx)return;
      const t=AUDIO.ctx.currentTime;
      playTone(notes[i%notes.length],0.22,'square',0.10,t);
      playTone(notes[i%notes.length]/2,0.22,'triangle',0.06,t);
      i++;
    };
    tick();AUDIO.bgmTimer=setInterval(tick,260);
  } else if(chap===2){
    // Low drone
    const t=AUDIO.ctx.currentTime;
    const o=AUDIO.ctx.createOscillator();o.type='sawtooth';o.frequency.value=55;
    const g=AUDIO.ctx.createGain();g.gain.value=0.07;
    o.connect(g);g.connect(AUDIO.master);o.start(t);
    AUDIO.bgmNodes.push(o);
    const o2=AUDIO.ctx.createOscillator();o2.type='sine';o2.frequency.value=82.4;
    const g2=AUDIO.ctx.createGain();g2.gain.value=0.05;
    o2.connect(g2);g2.connect(AUDIO.master);o2.start(t);
    AUDIO.bgmNodes.push(o2);
    AUDIO.bgmTimer=setInterval(()=>{
      if(AUDIO.muted||!AUDIO.ctx)return;
      const tn=AUDIO.ctx.currentTime;
      playTone([110,138.6,164.8,207.7][Math.floor(Math.random()*4)],0.6,'sine',0.05,tn);
    },1800);
  } else {
    // Hell: fast minor pattern + drum
    const chord=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.6],[164.8,196,246.9]];
    let i=0;
    const tick=()=>{
      if(AUDIO.muted||!AUDIO.ctx)return;
      const t=AUDIO.ctx.currentTime;
      const c=chord[i%chord.length];
      for(const f of c)playTone(f,0.18,'sawtooth',0.06,t);
      playNoise(0.05,0.12,5000);
      i++;
    };
    tick();AUDIO.bgmTimer=setInterval(tick,170);
  }
}

/* Equipment helpers */
function eqLvCost(curLv){return Math.floor(10*Math.pow(1.3,curLv-1));}
function eqMaxLv(rank){return RANK_LEVEL_MAX[rank]||10;}
function eqMaxSub(rank){return SUB_MAX[rank]||0;}
// Final percent bonus: base × (1 + level/max × 0.5) × (1 + sub × 0.15)
function eqBonusPct(eq){
  const base=RANK_PERCENT[eq.slot][eq.rank];
  const lvMul=1+((eq.level||1)-1)/(eqMaxLv(eq.rank)-1||1)*0.5;
  const subMul=1+(eq.sub||0)*0.15;
  return base*lvMul*subMul;
}
function eqStatValue(slot,rank){return RANK_PERCENT[slot][rank];} // legacy: base only
function getEquippedBonus(stat){
  for(const[sl,s]of Object.entries(SLOT_EFFECTS))if(s===stat&&save.equipped[sl]!=null){
    const eq=save.equipment.find(e=>e.id===save.equipped[sl]);
    if(eq)return eqBonusPct(eq);
  }
  return 0;
}

function calcPower(){
  const cd=save.chars[save.selectedChar];const ch=CHARS[save.selectedChar];
  let atk=ch.baseAtk*(1+(cd.lv-1)*0.08);
  let hp=ch.baseHp*(1+(cd.lv-1)*0.05);
  let speed=200,crit=5,bonus=0;
  for(const slot of Object.keys(SLOT_NAMES)){
    const id=save.equipped[slot];if(id==null)continue;
    const eq=getEqById(id);if(!eq)continue;
    const b=eqBonusPct(eq)/100;
    if(slot==='armor')hp*=1+b;
    if(slot==='boots')speed*=1+b;
    if(slot==='gloves')crit+=b*100;
    if(eq.rank==='red')bonus+=500;
    else if(eq.rank==='gold')bonus+=200;
    bonus+=[0,300,600,1000][eq.astral||0];
  }
  // Main weapon: ATK multiplier + flat power
  const mw=save.selectedWeapon;
  if(mw&&save.weaponsOwned[mw]){
    const mwR=save.weaponsOwned[mw];
    const mwLv=(save.weaponLevels&&save.weaponLevels[mw])||1;
    const rankAtk={gray:0.05,green:0.12,blue:0.22,purple:0.38,gold:0.60,red:0.90}[mwR]||0;
    atk*=(1+rankAtk)*(1+(mwLv-1)*0.02);
    const flat={gray:50,green:150,blue:300,purple:600,gold:1200,red:2500}[mwR]||0;
    bonus+=flat+mwLv*20;
    if(WEAPON_DEFS[mw]&&WEAPON_DEFS[mw].tier==='S')bonus+=1500;
  }
  return Math.floor(atk*10+hp*5+speed*100+crit*200+bonus);
}

window.setMainWeapon=function(id){
  if(!save.weaponsOwned[id]){flashMsg('Not owned');return;}
  save.selectedWeapon=id;saveSave();renderHome();SFX.coin();
};
window.dismantleWeapon=function(id){
  if(!save.weaponsOwned[id]){flashMsg('Not owned');return;}
  if(save.selectedWeapon===id){flashMsg('Unequip first');return;}
  // Don't allow dismantling kunai (default fallback)
  const ownedCount=Object.keys(save.weaponsOwned).length;
  if(ownedCount<=1){flashMsg('Last weapon — cannot dismantle');return;}
  const r=save.weaponsOwned[id];
  const v=DECOMPOSE_VAL[r]||DECOMPOSE_VAL.gray;
  save.basetech+=v.bt;save.cores+=v.core;
  delete save.weaponsOwned[id];
  if(save.weaponLevels)delete save.weaponLevels[id];
  saveSave();renderHome();flashMsg(`+${v.bt} BT${v.core?` +${v.core} Core`:''}`);
};

function renderMergeTab(){
  let h='<div style="max-width:800px;margin:0 auto">';
  h+=`<div style="text-align:center;margin-bottom:10px"><button class="btn btn-purple" onclick="autoMerge()">⚒ Merge All (Gray~Blue)</button></div>`;
  h+='<div style="font-size:11px;color:#aaa;text-align:center;margin-bottom:8px">Click a base item below to combine with same-slot materials.</div>';
  // Group by slot
  for(const[slot,name]of Object.entries(SLOT_NAMES)){
    const items=save.equipment.filter(e=>e.slot===slot&&!eqIsEquipped(e.id)&&e.rank!=='red').sort((a,b)=>RANKS.indexOf(b.rank)-RANKS.indexOf(a.rank)||(b.sub||0)-(a.sub||0));
    if(items.length===0)continue;
    h+=`<div style="margin:10px 0;padding:8px;background:rgba(0,0,0,.3);border-radius:8px">
      <div style="color:#fa0;font-weight:bold;margin-bottom:6px">${SLOT_ICONS[slot]} ${name}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for(const eq of items){
      const r=mergeRuleFor(eq);
      const found=r?findMergeMaterials(eq):null;
      const can=!!found;
      const tip=r?(can?`→ ${RANK_NAMES[r.to.rank]}${r.to.sub?'+'+r.to.sub:''}`:`Need ${r.mat} more ${RANK_NAMES[eq.rank]}`):'MAX';
      h+=`<div class="equip-slot rank-${eq.rank}" style="cursor:pointer;${can?'box-shadow:0 0 8px #0f0':''}" onclick="${can?`mergeOne(${eq.id})`:''}" title="${tip}">
        <div style="font-size:9px;color:${RANK_COLORS[eq.rank]};font-weight:bold">${eqLabel(eq)}</div>
        <div style="font-size:8px;color:#ddd">Lv${eq.level}</div>
        <div style="font-size:8px;color:${can?'#0f0':'#666'}">${tip}</div>
      </div>`;
    }
    h+='</div></div>';
  }
  h+='</div>';
  return h;
}

function renderAstralTab(){
  let h='<div style="max-width:700px;margin:0 auto">';
  h+='<div style="font-size:12px;color:#fa0;text-align:center;margin-bottom:10px">⚡ ASTRAL FORGE — only Mythic gear. Consumes 1 Gold + Basetech (+ Core for ★3).</div>';

  if(reds.length===0)h+='<div style="text-align:center;color:#888;padding:30px">No Mythic equipment yet. Get red gear from S-gacha or merge.</div>';
  for(const eq of reds){
    const star=eq.astral||0;

    const c=ASTRAL_COST[next];
    const goldOk=save.equipment.some(e=>e.slot===eq.slot&&e.rank==='gold'&&!eqIsEquipped(e.id));
    const btOk=c?save.basetech>=c.bt:false;

    const can=star<3&&goldOk&&btOk&&coreOk;
    h+=`<div style="background:rgba(0,0,0,.4);border:2px solid #f44;border-radius:10px;padding:12px;margin:10px 0">
      <div style="display:flex;align-items:center;gap:12px">

          ${star<3?`<div style="font-size:11px;color:#ddd;margin-top:6px">Cost: 1 Gold ${SLOT_NAMES[eq.slot]} + ${c.bt} BT${c.core?` + ${c.core} Core`:''}</div>`:'<div style="color:#fa0;font-weight:bold">★ MAX FORGED ★</div>'}

  h+='</div>';

window.openEqMenu=function(id,ev){
  ev&&ev.stopPropagation();
  const eq=getEqById(id);if(!eq)return;
  const isEq=eqIsEquipped(eq.id);
  const found=findMergeMaterials(eq);
  const canMerge=!!found&&!isEq;
  const canDown=(eq.sub||0)>0&&!isEq;
  const canLevel=eq.level<eqMaxLv(eq.rank);
  const lvCost=eqLvCost(eq.level);
  const skill=GRADE_SKILLS[eq.slot]&&GRADE_SKILLS[eq.slot][eq.rank];
  const m=document.getElementById('eqMenu');
  m.innerHTML=`<div style="font-weight:bold;margin-bottom:4px;color:${RANK_COLORS[eq.rank]}">${SLOT_ICONS[eq.slot]} ${eqLabel(eq)} ${SLOT_NAMES[eq.slot]}</div>
    <div style="font-size:11px;color:#0f0;margin-bottom:4px">Lv${eq.level}/${eqMaxLv(eq.rank)} → +${eqBonusPct(eq).toFixed(1)}% ${SLOT_EFFECTS[eq.slot]}</div>
    ${skill?`<div style="font-size:10px;color:#fa0;margin-bottom:4px">⚡ ${skill}</div>`:''}
    ${eq.astral>0?`<div style="font-size:10px;color:#f44;margin-bottom:4px">★${eq.astral} ${ASTRAL_DESC[eq.slot]}</div>`:''}
    <button class="btn-blue" onclick="equipOrUnequip(${id})">${isEq?'Unequip':'Equip'}</button>
    ${canLevel?`<button class="btn-green" onclick="levelUpEq(${id})">Lv Up (${lvCost}G)</button>`:''}
    ${canMerge?`<button class="btn-purple" onclick="mergeOne(${id})">Merge → ${RANK_NAMES[found.rule.to.rank]}${found.rule.to.sub?'+'+found.rule.to.sub:''}</button>`:''}
    ${canDown?`<button class="btn" style="background:#666" onclick="downgradeEquip(${id})">Downgrade</button>`:''}
    ${eq.rank==='red'?`<button class="btn-red" onclick="setEquipTab('Astral');closeEqMenu();">⚡ Astral Forge →</button>`:''}
    ${!isEq?`<button class="btn" style="background:#922" onclick="decomposeEq(${id})">Decompose (+${DECOMPOSE_VAL[eq.rank].bt}BT${DECOMPOSE_VAL[eq.rank].core?',+'+DECOMPOSE_VAL[eq.rank].core+'C':''})</button>`:''}
    <button class="btn-gray" style="background:#444" onclick="closeEqMenu()">Close</button>`;
  m.style.display='block';
  const r=ev.target.getBoundingClientRect();

const MERGE_RULES={
  gray_0:  {to:{rank:'green', sub:0},mat:2,matchSub:false},
  green_0: {to:{rank:'blue',  sub:0},mat:2,matchSub:false},
  blue_0:  {to:{rank:'purple',sub:0},mat:2,matchSub:false},
  purple_0:{to:{rank:'purple',sub:1},mat:1,matchSub:false},
  purple_1:{to:{rank:'purple',sub:2},mat:2,matchSub:false},
  purple_2:{to:{rank:'gold',  sub:0},mat:1,matchSub:true},
  gold_0:  {to:{rank:'gold',  sub:1},mat:1,matchSub:false},
  gold_1:  {to:{rank:'gold',  sub:2},mat:2,matchSub:false},
  gold_2:  {to:{rank:'gold',  sub:3},mat:3,matchSub:false},
  gold_3:  {to:{rank:'red',   sub:0},mat:1,matchSub:true},
};
function mergeRuleFor(eq){return eq.rank==='red'?null:MERGE_RULES[eq.rank+'_'+(eq.sub||0)];}
function findMergeMaterials(eq){
  const r=mergeRuleFor(eq);if(!r)return null;
  const cands=save.equipment.filter(e=>e.id!==eq.id&&e.slot===eq.slot&&e.rank===eq.rank&&!eqIsEquipped(e.id)&&(!r.matchSub||(e.sub||0)===(eq.sub||0)));
  if(cands.length<r.mat)return null;
  cands.sort((a,b)=>(a.level||1)-(b.level||1)+((a.sub||0)-(b.sub||0))*0.5);
  return {rule:r,materials:cands.slice(0,r.mat)};
}
function doMerge(baseId){
  const base=getEqById(baseId);if(!base||eqIsEquipped(baseId))return null;
  const found=findMergeMaterials(base);if(!found)return null;
  const ids=new Set(found.materials.map(m=>m.id));
  save.equipment=save.equipment.filter(e=>!ids.has(e.id));
  base.rank=found.rule.to.rank;base.sub=found.rule.to.sub;base.level=1;
  saveSave();return base;
}
window.mergeOne=function(id){
  const r=doMerge(id);
  if(r){closeEqMenu();flashRankUp(r.rank);SFX.levelUp();renderHome();}
  else flashMsg('Not enough materials');
};
window.downgradeEquip=function(id){
  const eq=getEqById(id);if(!eq||eqIsEquipped(id)||(eq.sub||0)<=0)return;
  const sub=eq.sub;
  const refund=sub===1?1:sub===2?2:sub===3?3:0;
  eq.sub=sub-1;
  for(let i=0;i<refund;i++)if(save.equipment.length<50)makeEquip(eq.slot,eq.rank);
  saveSave();closeEqMenu();renderHome();flashMsg(`+${refund} ${RANK_NAMES[eq.rank]} returned`);
};
window.autoMerge=function(){
  let merged=true,cnt=0;
  while(merged&&cnt<200){
    merged=false;cnt++;
    for(const rank of['gray','green','blue']){
      for(const slot of Object.keys(SLOT_NAMES)){

};

window.astralForge=function(id){

};

// Weapon pool by rank availability
const NORMAL_WEAPONS=['kunai','katana','bat','shotgun','lightchaser','force','drill','soccer'];
const GREEN_WEAPONS=['kunai','bat','drill','soccer'];
const S_WEAPONS=['lightChaserS','forceS','chaosBlade'];
function _grantWeapon(id,rank){
  const cur=save.weaponsOwned[id];
  if(!cur||RANKS.indexOf(rank)>RANKS.indexOf(cur))save.weaponsOwned[id]=rank;
  return {kind:'weapon',id,rank};
}
function _gachaResult(rank,gachaType){
  // 30% chance to get a weapon (if pool non-empty for the rank), else equipment
  let pool=null;
  if(rank==='gray')pool=null; // gray weapons not allowed (defense only)
  else if(rank==='green')pool=GREEN_WEAPONS;
  else pool=NORMAL_WEAPONS;
  if(rank==='red'&&gachaType==='s'){
    // 70% normal red weapon, 30% S-weapon
    if(Math.random()<0.30){
      const sw=S_WEAPONS[Math.floor(Math.random()*S_WEAPONS.length)];
      // S-rank prob: 40% lcS, 40% forceS, 20% chaos — roll again
      const r=Math.random();
      const swPick=r<0.4?'lightChaserS':r<0.8?'forceS':'chaosBlade';
      return _grantWeapon(swPick,'red');
    }
  }
  if(pool&&Math.random()<0.30){
    const wid=pool[Math.floor(Math.random()*pool.length)];
    return _grantWeapon(wid,rank);
  }
  // Equipment
  const slots=Object.keys(SLOT_NAMES);
  const slot=slots[Math.floor(Math.random()*slots.length)];
  const id=makeEquip(slot,rank);
  const eq=save.equipment.find(e=>e.id===id);
  return {kind:'equip',eq,rank};
}
window.doGacha=function(type,count){
  const cost=type==='normal'?(count===1?100:500):(count===1?300:2680);
  if(save.coins<cost){flashMsg('Not enough coins!');return;}
  if(save.equipment.length>=50){flashMsg('Inventory full!');return;}
  save.coins-=cost;
  const results=[];
  for(let i=0;i<count;i++){
    if(save.equipment.length>=50)break;
    let rank;
    if(type==='normal'){
      const r=Math.random();
      rank=r<0.50?'gray':r<0.80?'green':r<0.95?'blue':r<0.99?'purple':'gold';
    }else{
      save.sgachaPity++;
      if(save.sgachaPity>=50){rank='red';save.sgachaPity=0;}
      else{const r=Math.random();rank=r<0.40?'purple':r<0.80?'gold':'red';if(rank==='red')save.sgachaPity=0;}
    }
    const res=_gachaResult(rank,type);
    results.push(res);
    save.gachaTotal++;
    save.records.gachaTotal=(save.records.gachaTotal||0)+1;
    if(rank==='red')save.records.mythicCount=(save.records.mythicCount||0)+1;
  }
  dailyProgress('gacha',1);
  saveSave();
  audioInit();SFX.gacha();
  // Trigger S-rank intro if any S-weapon was pulled
  const sPull=results.find(r=>r.kind==='weapon'&&WEAPON_DEFS[r.id]&&WEAPON_DEFS[r.id].tier==='S');
  if(sPull){flashSWeapon(sPull.id);}
  showGachaPopup(results);
  renderHome();
};

function renderDaily(p){

      <div class="info">

ja.addEventListener('touchend',()=>{joyDx=0;joyDy=0;jk.style.left='45px';jk.style.top='45px';});
function handleJoy(e){
  e.preventDefault();const t=e.touches[0];const rect=ja.getBoundingClientRect();
  const cx=rect.left+70,cy=rect.top+70;
  let dx2=t.clientX-cx,dy2=t.clientY-cy;
  const d2=Math.sqrt(dx2*dx2+dy2*dy2);
  if(d2>45){dx2=dx2/d2*45;dy2=dy2/d2*45;}
  jk.style.left=(45+dx2)+'px';jk.style.top=(45+dy2)+'px';
  joyDx=dx2/45;joyDy=dy2/45;
}

function distXY(ax,ay,bx,by){const d1=ax-bx,d2=ay-by;return Math.sqrt(d1*d1+d2*d2);}
function dist2(a,b){return distXY(a.x,a.y,b.x,b.y);}
function rnd(a,b){return a+Math.random()*(b-a);}

function getW(id){return player.weapons.find(w=>w.id===id);}
function getP(id){return player.passives.find(p=>p.id===id);}
const _BASE_DMG={
  kunai:8,katana:14,bat:14,shotgun:10,lightchaser:14,force:25,drill:18,soccer:12,
  lightChaserS:22,forceS:35,chaosBlade:24,
  spiritBlade:18,yotou:24,lucille:22,hyperShot:14,swordArray:22,
  forceMastery:38,vibrationDrill:30,quantumBall:22,
  sLightArray:32,voidLord:50,chaosJudge:36,
  // Sub-skills
  molotov:6,boomerang:14,garlic:5,bible:12,lightning:25,drone:9,
  hellfire:14,quantumBoomerang:24,soulEater:14,unholyBible:30,thunderWrath:40,destroyer:30};
function wDmg(w){const def=WEAPON_DEFS[w.id];const base=_BASE_DMG[w.id]||10;
  const mul=(def.dmgMul&&def.dmgMul[w.lv-1])||1;
  return base*mul*player.might;
}

function initBattle(){
  const ch=CHARS[save.selectedChar];
  const cd=save.chars[save.selectedChar];
  const atkBonus=getEquippedBonus('ATK'),hpBonus=getEquippedBonus('MaxHP'),spdBonus=getEquippedBonus('Speed'),
        cdBonus=getEquippedBonus('CD Reduce'),critBonus=getEquippedBonus('Crit%'),xpBonus=getEquippedBonus('XP Gain');

  const tal=save.talents||{};
  const tAtk=(tal.atk||0)*0.02,tHp=(tal.hp||0)*0.02,tSpd=(tal.speed||0)*0.01,
        tCoin=(tal.coin||0)*0.05,tXp=(tal.xp||0)*0.03,tCd=(tal.cd||0)*0.02;
  const baseHp=Math.floor(ch.baseHp*(1+(cd.lv-1)*0.05)*(1+hpBonus/100)*(1+tHp));
  const baseSpd=Math.floor(200*(1+spdBonus/100)*(1+tSpd));
  const charAtkMult=ch.baseAtk/100; // common=1.0, archer=1.3, knight=0.8
  const baseMight=charAtkMult*(1+(cd.lv-1)*0.08+atkBonus/100)*(1+tAtk);
  player={
    x:0,y:0,radius:18,
    baseSpeed:baseSpd,speed:baseSpd,
    baseMaxHp:baseHp,maxHp:baseHp,hp:baseHp,
    level:1,xp:0,xpToNext:10,
    baseMight,might:baseMight,
    armor:0,baseCdReduction:cdBonus/100+tCd,cdReduction:cdBonus/100+tCd,
    magnetRange:100,hpRegen:0.1,
    invTimer:0,
    weapons:[],passives:[],
    charId:save.selectedChar,
    critRate:critBonus,
    xpMult:(1+xpBonus/100)*(1+tXp),
    coinBonus:tCoin,
    facing:1,lastDx:1,lastDy:0,
    knightReduction:save.selectedChar==='knight'?0.15:0,
    archerRangeBonus:save.selectedChar==='archer'?0.3:0,
    commonCoinBonus:save.selectedChar==='common',
    gskills:{},critCombo:0,nextGuaranteedCrit:0,shieldHp:0,shieldCd:0,
  };
  // Resolve main weapon: selected if owned + valid; null = no initial skill
  let mainW=save.selectedWeapon;
  if(mainW&&(!WEAPON_DEFS[mainW]||WEAPON_DEFS[mainW].evolved||!save.weaponsOwned[mainW]))mainW=null;
  // Main-weapon ATK bonus (rank + level)
  if(mainW){
    const mwRank=save.weaponsOwned[mainW]||'gray';
    const mwLv=(save.weaponLevels&&save.weaponLevels[mainW])||1;
    const mwRankBonus={gray:0.05,green:0.12,blue:0.22,purple:0.38,gold:0.60,red:0.90}[mwRank]||0;
    const mwLvBonus=(mwLv-1)*0.02;
    player.baseMight*=(1+mwRankBonus)*(1+mwLvBonus);
    player.might=player.baseMight;
  }
  player.mainWeaponId=mainW||null;
  // Compute equipped grade-skill flags
  for(const slot of Object.keys(SLOT_NAMES)){
    const id=save.equipped[slot];if(id==null)continue;
    const eq=getEqById(id);if(!eq)continue;
    player.gskills[slot]={ri:RANKS.indexOf(eq.rank),sub:eq.sub||0,astral:eq.astral||0};
  }
  // Main weapon rank → weapon grade-skill (replaces the removed weapon slot)
  if(mainW){
    const _mwR=save.weaponsOwned[mainW]||'gray';
    player.gskills.weapon={ri:RANKS.indexOf(_mwR),sub:0,astral:0};
  }
  // Belt-blue: magnet +50%
  if(player.gskills.belt&&player.gskills.belt.ri>=2)player.magnetRange*=1.5;
  // Boots-purple: speed→ATK (precomputed)
  if(player.gskills.boots&&player.gskills.boots.ri>=3){
    const spdRatio=Math.min(player.speed/200,1.5);
    player.baseMight*=1+(spdRatio-1)*0.6;player.might=player.baseMight;
  }
  // Armor-purple: HP<50% ATK+20% (handled dynamically — flag only)
  if(mainW){
    player.weapons.push({id:mainW,lv:1,timer:0});
    if(!save.records.weaponsUsed)save.records.weaponsUsed=[];
    if(!save.records.weaponsUsed.includes(mainW))save.records.weaponsUsed.push(mainW);
  }

  bullets=[];enemies=[];gems=[];coins2=[];particles=[];chests2=[];energyDrinks=[];
  weaponProjectiles=[];lightningFx=[];whipFx=[];dmgPopups=[];deadFx=[];fireZones=[];
  levelUpFlash=0;runLevelUps=0;playerMoving=false;playerDmgFlash=0;
  resetFlash=0;bossVictoryT=0;equipPopups=[];
  bossActive=null;bossesSpawned=[];deathEntity=null;deathWarnTimer=0;
  gameTime=0;dt2=0;lastTs=0;enemySpawnTimer=0;pendingLvl=0;
  levelUpChoices=[];selectedChoice=-1;
  waveText='';waveTimer=0;lastWaveMin=-1;
  runGold=0;runKills=0;runEquipsDropped=[];
  pet={x:player.x,y:player.y,state:'orbit',angle:0,target:null,timer:0,vy:0,hopT:0};
  bState='playing';

  save.records.totalBattles++;
  dailyProgress('battle',1);
  saveSave();

  requestAnimationFrame(battleLoop);
}

function spawnParticles2(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=50+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.3,maxLife:.5,radius:2+Math.random()*3,color:c});}}

function queueEquipPopup(eq){
  if(!eq||!equipPopups)return;
  const cur=getEqById(save.equipped[eq.slot]);
  const newP=eqBonusPct(eq);
  const oldP=cur?eqBonusPct(cur):0;
  equipPopups.push({eq,life:3.0,maxLife:3.0,newP,oldP,stronger:newP>oldP});
}

function spawnDmgPop(x,y,dmg,evo,crit){
  dmgPopups.push({
    x:x+rnd(-8,8),y,
    text:(crit?'CRIT! ':'')+(Math.round(dmg)+''),
    life:1.0,maxLife:1.0,
    color:crit?'#f44':evo?'#ffd700':'#ff0',
    size:evo?18:crit?17:13
  });
}

function applyDmg(e,dmg,wid){
  let crit=false;
  // Armor-purple: HP<50% ATK+20%
  if(player.gskills&&player.gskills.armor&&player.gskills.armor.ri>=3&&player.hp<player.maxHp*0.5)dmg*=1.2;
  // Gloves-red: forced crit if combo armed
  if(player.nextGuaranteedCrit>0){dmg*=3;crit=true;player.nextGuaranteedCrit--;}
  else if(Math.random()*100<player.critRate){dmg*=2;crit=true;}
  // Gloves-blue: crit dmg +50%
  if(crit&&player.gskills&&player.gskills.gloves&&player.gskills.gloves.ri>=2)dmg*=1.5;
  e.hp-=dmg;e.flashTimer=.08;spawnParticles2(e.x,e.y,'#fff',2);
  spawnDmgPop(e.x,e.y-e.radius,dmg,WEAPON_DEFS[wid]&&WEAPON_DEFS[wid].evolved,crit);
  if(crit&&player.gskills&&player.gskills.gloves){
    const gri=player.gskills.gloves.ri;
    if(gri>=3)player.hp=Math.min(player.maxHp,player.hp+3); // purple heal
    if(gri>=4){ // gold splash
      for(const e2 of enemies)if(e2!==e&&distXY(e.x,e.y,e2.x,e2.y)<80){e2.hp-=dmg*0.3;e2.flashTimer=.05;}
    }
    if(gri>=5){ // red combo
      player.critCombo=(player.critCombo||0)+1;
      if(player.critCombo>=5){player.critCombo=0;player.nextGuaranteedCrit=1;}
    }
  }
}

/* Wave */
function getWaveTypes(m){const t=[];if(m<18)t.push('zombie');if(m>=3)t.push('skeleton');if(m>=7)t.push('armorZombie');if(m>=12)t.push('ghost');if(m>=18)t.push('demon');return t;}
function getWaveName(m){
  const c=m%5;
  if(c===1)return'🧟 ZOMBIE HORDE';
  if(c===2)return'💀 SKELETON ARMY';
  if(c===3)return'🐉 DEMON RUSH';
  if(c===4)return'👻 GHOST SWARM';
  return'⚔️ BOSS INCOMING';
}
function getHordeType(m){
  const c=m%5;
  if(c===1)return'zombie';
  if(c===2)return'skeleton';
  if(c===3)return m>=18?'demon':'armorZombie';
  if(c===4)return m>=12?'ghost':'skeleton';
  return getWaveTypes(m).slice(-1)[0];
}

/* Weapons (DadaSurvivor-style ★1-5 + evolved) */
function nearestEnemy(){let n=null,nd=Infinity;for(const e of enemies){const d=dist2(e,player);if(d<nd){nd=d;n=e;}}return n;}
function wCdFinal(base){return Math.max(0.05,base*(1-player.cdReduction));}
function fireBullet(b){
  const wgs=player.gskills.weapon;
  if(wgs&&wgs.ri>=2)b.pierce=(b.pierce||1)+1; // grade-blue
  bullets.push(b);
  if(wgs&&wgs.ri>=5){ // grade-red split
    const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(sp<=0)return;
    const a=Math.atan2(b.vy,b.vx);
    for(const off of[-0.3,0.3]){
      bullets.push({...b,vx:Math.cos(a+off)*sp,vy:Math.sin(a+off)*sp,damage:b.damage*0.7,color:'#f44'});
    }
  }
}

function updateWeapons(){
  for(const w of player.weapons){
    const def=WEAPON_DEFS[w.id];const s=w.lv;
    const dmg=wDmg(w);
    if(w.id==='kunai'||w.id==='spiritBlade'){
      const rate=w.id==='spiritBlade'?9:def.rate[s-1];
      const cd=wCdFinal(1.0/rate);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const cnt=def.count?def.count[s-1]:1;
      const homing=(w.id==='spiritBlade');
      for(let i=0;i<cnt;i++){
        const tgt=nearestEnemy();
        const ang=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x)+(i-(cnt-1)/2)*0.12:Math.atan2(player.lastDy,player.lastDx);
        const spd=520;
        fireBullet({x:player.x,y:player.y,radius:homing?6:4,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg*(homing?2:1),pierce:def.pierce||(homing?5:2),life:1.6,color:def.color,wid:w.id,
          kind:'kunai',angle:ang,homing});
      }
    }
    else if(w.id==='shotgun'||w.id==='hyperShot'){
      const isEv=w.id==='hyperShot';
      const baseCd=isEv?0.5:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const baseCnt=isEv?(def.pellets?def.pellets[4]*3:30):def.pellets[s-1];
      const spread=isEv?Math.PI:def.spread[s-1];
      const tgt=nearestEnemy();
      const baseAng=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):Math.atan2(player.lastDy,player.lastDx);
      const spd=380;
      for(let i=0;i<baseCnt;i++){
        const off=baseCnt>1?((i/(baseCnt-1))-0.5)*spread:0;
        const ang=baseAng+off;
        fireBullet({x:player.x,y:player.y,radius:4,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg,pierce:1,life:0.7,color:def.color,wid:w.id,kind:'pellet',angle:ang});
      }
    }
    else if(w.id==='katana'||w.id==='yotou'){
      const isEv=w.id==='yotou';
      const baseCd=isEv?0.4:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const ang=Math.atan2(player.lastDy,player.lastDx);
      const reach=120;
      // Forward 120° arc swing
      whipFx.push({x:player.x,y:player.y,dir:Math.cos(ang)>=0?1:-1,area:reach,life:.18,maxLife:.18,color:def.color,arcAng:ang});
      for(const e of enemies){
        const ea=Math.atan2(e.y-player.y,e.x-player.x);
        let da=ea-ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
        if(Math.abs(da)<Math.PI/3&&dist2(e,player)<reach+e.radius){
          applyDmg(e,dmg,w.id);
          if(isEv)player.hp=Math.min(player.maxHp,player.hp+2);
        }
      }
      // Every 5 hits at ★3+: 4-way wave
      w.hitCnt=(w.hitCnt||0)+1;
      if(((s>=3&&!isEv)||isEv)&&w.hitCnt%5===0){
        for(let d=0;d<4;d++){
          const wa=d*Math.PI/2;
          fireBullet({x:player.x,y:player.y,radius:8,vx:Math.cos(wa)*340,vy:Math.sin(wa)*340,
            damage:dmg*0.7,pierce:isEv?99:3,life:1.2,color:'#a0f',wid:w.id,kind:'wave',angle:wa});
          if((s===5&&!isEv)||isEv){
            // splits
            for(const off of[-0.4,0.4]){
              fireBullet({x:player.x,y:player.y,radius:6,vx:Math.cos(wa+off)*320,vy:Math.sin(wa+off)*320,
                damage:dmg*0.5,pierce:2,life:1.0,color:'#a0f',wid:w.id,kind:'wave',angle:wa+off});
            }
          }
        }
      }
    }
    else if(w.id==='bat'||w.id==='lucille'){
      // Orbit logic handled in updateOrbits
      w.timer=0;
    }
    else if(w.id==='lightchaser'||w.id==='lightChaserS'||w.id==='swordArray'||w.id==='sLightArray'){
      const isS=w.id==='lightChaserS'||w.id==='sLightArray';
      const isEv=w.id==='swordArray'||w.id==='sLightArray';
      const baseCd=isEv?0.5:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const rays=isEv?(isS?24:12):def.rays[s-1];
      const spd=isS?500:440;
      for(let r=0;r<rays;r++){
        const ang=(Math.PI*2/rays)*r+gameTime*0.8;
        fireBullet({x:player.x,y:player.y,radius:5,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg,pierce:isEv?6:3,life:0.7,color:def.color,wid:w.id,kind:'ray',angle:ang});
      }
      // Sword Aura at ★5 (every 10 fires) or always for evolved
      w.fireCnt=(w.fireCnt||0)+1;
      if((s===5&&!isEv&&w.fireCnt%10===0)||(isEv&&w.fireCnt%4===0)){
        for(const e of enemies)if(dist2(e,player)<260)applyDmg(e,dmg*1.4,w.id);
        whipFx.push({x:player.x,y:player.y,dir:0,area:260,life:.4,maxLife:.4,color:'#fc0'});
      }
    }
    else if(w.id==='force'||w.id==='forceS'||w.id==='forceMastery'||w.id==='voidLord'){
      const isS=w.id==='forceS'||w.id==='voidLord';
      const isEv=w.id==='forceMastery'||w.id==='voidLord';
      const baseCd=def.cd?def.cd[s-1]:1.5;
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const cnt=w.id==='voidLord'?4:isEv?2:isS?2:1;
      const ang0=Math.atan2(player.lastDy,player.lastDx);
      for(let i=0;i<cnt;i++){
        const off=(i-(cnt-1)/2)*0.5;const ang=ang0+off;
        const spd=260;
        bullets.push({x:player.x,y:player.y,radius:14,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg*0.4,pierce:99,life:2.5*(player.forceDur||1),color:def.color,wid:w.id,kind:'blackhole',
          ttl:1.5*(player.forceDur||1),pull:140,burstDmg:dmg,burstR:120});
      }
    }
    else if(w.id==='drill'||w.id==='vibrationDrill'){
      const isEv=w.id==='vibrationDrill';
      const baseCd=isEv?0.5:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const tgt=nearestEnemy();
      const ang=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):Math.atan2(player.lastDy,player.lastDx);
      const spd=isEv?620:500;
      const pierce=isEv?99:def.pierce[s-1];
      const bouncy=isEv||s>=3;
      bullets.push({x:player.x,y:player.y,radius:7,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        damage:dmg,pierce,life:1.6,color:def.color,wid:w.id,kind:'drill',angle:ang,
        homing:isEv||player.drillHoming,bounces:bouncy?(isEv?6:3):0});
    }
    else if(w.id==='soccer'||w.id==='quantumBall'){
      const isEv=w.id==='quantumBall';
      const baseCd=isEv?0.7:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const cnt=isEv?5:def.balls[s-1];
      const bnc=(isEv?8:def.bounces[s-1])+(player.extraBounces||0);
      const dirs=cnt===1?[0]:cnt===2?[0,Math.PI]:cnt===3?[0,2*Math.PI/3,4*Math.PI/3]:[0,Math.PI/2,Math.PI,3*Math.PI/2];
      for(const ang of dirs){
        const spd=380;
        bullets.push({x:player.x,y:player.y,radius:9,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg,pierce:99,life:6,color:'#fff',wid:w.id,kind:'soccer',angle:ang,
          bounces:bnc,homing:isEv,bounceTeleport:isEv});
      }
    }
    else if(w.id==='chaosBlade'||w.id==='chaosJudge'){
      const isEv=w.id==='chaosJudge';
      const baseCd=isEv?0.3:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const ang=Math.atan2(player.lastDy,player.lastDx);
      const reach=140;
      whipFx.push({x:player.x,y:player.y,dir:0,area:reach,life:.22,maxLife:.22,color:'#f44',arcAng:ang,chaos:true});
      const exec=def.executePct?def.executePct[s-1]:0;
      for(const e of enemies){
        const dd=dist2(e,player);
        if(dd<reach+e.radius){
          let killed=false;
          if(isEv){
            const ex=e.isBoss?20:80;
            if(Math.random()*100<ex){e.hp=0;killed=true;}
          } else if(!e.isBoss&&Math.random()*100<exec){e.hp=0;killed=true;}
          if(!killed)applyDmg(e,dmg,w.id);
        }
      }
      if(isEv){
        // Omni-wave on every swing
        for(let d=0;d<8;d++){
          const wa=d*Math.PI/4;
          fireBullet({x:player.x,y:player.y,radius:6,vx:Math.cos(wa)*360,vy:Math.sin(wa)*360,
            damage:dmg*0.6,pierce:5,life:1.2,color:'#f44',wid:w.id,kind:'wave',angle:wa});
        }
      }
    }
    /* === SUB-SKILLS === */
    else if(w.id==='molotov'||w.id==='hellfire'){
      const isEv=w.id==='hellfire';
      const baseCd=isEv?1.5:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const cnt=isEv?2:def.count[s-1];
      const baseRad=(isEv?60:def.radius[s-1])*(player.areaMult||1)*(isEv?3:1);
      const baseDur=(isEv?3:def.dur[s-1])*(player.subDur||1);
      for(let i=0;i<cnt;i++){
        const tgt=nearestEnemy();
        const ang=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x)+(i-(cnt-1)/2)*0.2:Math.atan2(player.lastDy,player.lastDx);
        const dist=tgt?Math.min(distXY(player.x,player.y,tgt.x,tgt.y),300):220;
        const tx=player.x+Math.cos(ang)*dist,ty=player.y+Math.sin(ang)*dist;
        fireZones.push({x:tx,y:ty,radius:baseRad,life:baseDur,maxLife:baseDur,dmg:dmg*0.6,wid:w.id,
          burst:isEv||s>=5,poison:isEv,tickT:0});
        // Throwing arc particle
        for(let p=0;p<4;p++)particles.push({x:player.x,y:player.y,vx:Math.cos(ang)*200+rnd(-30,30),vy:Math.sin(ang)*200+rnd(-30,30)-50,life:.5,maxLife:.5,radius:3,color:'#f80'});
      }
    }
    else if(w.id==='boomerang'||w.id==='quantumBoomerang'){
      const isEv=w.id==='quantumBoomerang';
      const baseCd=isEv?2.0:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const cnt=isEv?2:def.count[s-1];
      const sz=isEv?12:def.size[s-1];
      const tgt=nearestEnemy();
      const baseAng=tgt?Math.atan2(tgt.y-player.y,tgt.x-player.x):Math.atan2(player.lastDy,player.lastDx);
      const spd=350;
      for(let i=0;i<cnt;i++){
        const ang=baseAng+(i-(cnt-1)/2)*0.4;
        bullets.push({x:player.x,y:player.y,radius:sz,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg,pierce:isEv?99:def.pierce[s-1]*2,life:isEv?6:1.6,color:def.color,wid:w.id,kind:'boomerang',
          angle:ang,phase:'out',spinT:0,homing:isEv,returning:false});
      }
    }
    else if(w.id==='garlic'||w.id==='soulEater'){
      // Always-on aura, ticks every 0.4s
      w.timer+=dt2;if(w.timer<0.4)continue;w.timer=0;
      const isEv=w.id==='soulEater';
      const r=(isEv?120:def.radius[s-1])*(player.areaMult||1);
      for(const e of enemies){
        const d=dist2(e,player);
        if(d<r+e.radius){
          applyDmg(e,dmg,w.id);
          if(s>=4||isEv){const a=Math.atan2(e.y-player.y,e.x-player.x);e.kbx=Math.cos(a)*15;e.kby=Math.sin(a)*15;e.kbT=0.05;}
          if(s>=5||isEv)e.poisoned=2.0;
        }
      }
      if(isEv){
        player.hp=Math.min(player.maxHp,player.hp+0.5*0.4);
        for(const g of gems){if(dist2(g,player)<r){g.x=player.x;g.y=player.y;}}
      }
    }
    else if(w.id==='bible'||w.id==='unholyBible'){
      // Orbit logic in updateOrbits
      w.timer=0;
    }
    else if(w.id==='lightning'||w.id==='thunderWrath'){
      const isEv=w.id==='thunderWrath';
      const baseCd=isEv?3.0:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      let tgts;
      if(isEv){tgts=enemies.filter(e=>dist2(e,player)<900);}
      else{
        const tn=def.targets[s-1];
        tgts=enemies.filter(e=>dist2(e,player)<700).sort(()=>Math.random()-.5).slice(0,Math.min(tn,enemies.length));
      }
      const chainCount=isEv?99:def.chain[s-1];
      for(const e of tgts){
        applyDmg(e,dmg,w.id);lightningFx.push({x:e.x,y:e.y,life:.3,maxLife:.3});
        let cur=e;const hit=new Set([e]);
        for(let c=0;c<chainCount;c++){
          let near=null,nd=Infinity;
          for(const e2 of enemies){if(hit.has(e2))continue;const d=distXY(cur.x,cur.y,e2.x,e2.y);if(d<nd&&d<200){nd=d;near=e2;}}
          if(!near)break;
          applyDmg(near,dmg*0.7,w.id);lightningFx.push({x:near.x,y:near.y,life:.25,maxLife:.25});
          hit.add(near);cur=near;
        }
      }
    }
    else if(w.id==='drone'||w.id==='destroyer'){
      const isEv=w.id==='destroyer';
      const baseCd=isEv?0.3:def.cd[s-1];
      const cd=wCdFinal(baseCd);
      w.timer+=dt2;if(w.timer<cd)continue;w.timer=0;
      const droneN=isEv?3:def.drones[s-1];
      const missile=isEv||(def.missile&&def.missile[s-1]);
      const homing=isEv||player.droneLock;
      for(let i=0;i<droneN;i++){
        const ang2=gameTime*1.5+i*Math.PI*2/droneN;
        const dx=player.x+Math.cos(ang2)*40;
        const dy=player.y+Math.sin(ang2)*40-10;
        const tgt=nearestEnemy();
        if(!tgt)continue;
        const ang=Math.atan2(tgt.y-dy,tgt.x-dx);
        const spd=isEv?500:380;
        fireBullet({x:dx,y:dy,radius:isEv?5:3,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
          damage:dmg*(isEv?1.4:1),pierce:isEv?3:1,life:isEv?2.0:1.2,
          color:missile?'#fff':def.color,wid:w.id,kind:missile?'missile':'pellet',angle:ang,homing});
      }
    }
  }
}

/* Orbits: bat/lucille + bible/unholyBible */
function updateOrbits(){
  const bw=getW('bat')||getW('lucille')||getW('bible')||getW('unholyBible');
  if(!bw){weaponProjectiles=[];return;}
  const def=WEAPON_DEFS[bw.id];
  const isLuc=bw.id==='lucille';
  const isBible=bw.id==='bible'||bw.id==='unholyBible';
  const isUnholy=bw.id==='unholyBible';
  let cnt,baseSpd;
  if(isLuc){cnt=5;baseSpd=(def.spd?def.spd[4]*3:9);}
  else if(isUnholy){cnt=6;baseSpd=def.spd?def.spd[4]*3:18;}
  else{cnt=def.orbits[bw.lv-1];baseSpd=def.spd[bw.lv-1];}
  const oR=def.orbitR||90;
  const dmg=wDmg(bw)*(isUnholy?3:1);
  while(weaponProjectiles.length<cnt)weaponProjectiles.push({angle:weaponProjectiles.length*(Math.PI*2/cnt),hc:{}});
  while(weaponProjectiles.length>cnt)weaponProjectiles.pop();
  for(const o of weaponProjectiles){
    o.angle+=baseSpd*dt2;o.x=player.x+Math.cos(o.angle)*oR;o.y=player.y+Math.sin(o.angle)*oR;
    for(let i=0;i<enemies.length;i++){const e=enemies[i];
      if(distXY(o.x,o.y,e.x,e.y)<14+e.radius){if(!o.hc[i]||o.hc[i]<=0){
        applyDmg(e,dmg,bw.id);o.hc[i]=.25;
        if(isLuc){e.burnT=3.0;e.burnDmg=dmg*0.4;}
      }}
    }
    for(const k in o.hc){o.hc[k]-=dt2;if(o.hc[k]<=0)delete o.hc[k];}
  }
  // ★5 / lucille AoE pulse around player every 2s
  if((bw.id==='bat'&&bw.lv===5)||isLuc){
    bw.aoeT=(bw.aoeT||0)+dt2;
    if(bw.aoeT>=2){bw.aoeT=0;
      for(const e of enemies)if(dist2(e,player)<140)applyDmg(e,dmg*0.6,bw.id);
      whipFx.push({x:player.x,y:player.y,dir:0,area:140,life:.25,maxLife:.25,color:def.color});
    }
  }
}

/* Fire zones (molotov puddles) */
function updateFireZones(){
  for(let i=fireZones.length-1;i>=0;i--){
    const z=fireZones[i];
    z.life-=dt2;z.tickT-=dt2;
    if(z.tickT<=0){
      z.tickT=0.3;
      for(const e of enemies)if(distXY(z.x,z.y,e.x,e.y)<z.radius+e.radius){
        applyDmg(e,z.dmg,z.wid);
        if(z.poison)e.poisoned=2.0;
      }
      if(Math.random()<0.5)particles.push({x:z.x+rnd(-z.radius,z.radius),y:z.y+rnd(-z.radius,z.radius),vx:rnd(-10,10),vy:-rnd(20,40),life:.5,maxLife:.5,radius:3,color:'#f80'});
    }
    if(z.life<=0){
      if(z.burst){
        for(const e of enemies)if(distXY(z.x,z.y,e.x,e.y)<z.radius*1.4)applyDmg(e,z.dmg*4,z.wid);
        lightningFx.push({x:z.x,y:z.y,life:.3,maxLife:.3,kind:'explosion'});
        for(let p=0;p<10;p++)particles.push({x:z.x,y:z.y,vx:rnd(-150,150),vy:rnd(-150,150),life:.5,maxLife:.5,radius:3,color:'#f60'});
      }
      fireZones.splice(i,1);
    }
  }
}

/* Poison DOT */
function updatePoison(){
  for(const e of enemies){
    if(e.poisoned>0){
      e.hp-=2*dt2;e.poisoned-=dt2;
      if(Math.random()<0.15)spawnParticles2(e.x,e.y,'#0f0',1);
    }
  }
}

/* Apply lucille burn DOT each frame */
function updateBurns(){
  for(const e of enemies){
    if(e.burnT>0){
      e.hp-=e.burnDmg*dt2;e.burnT-=dt2;
      if(Math.random()<0.3)spawnParticles2(e.x,e.y,'#f60',1);
    }
  }
}

/* Force-field aux: damage anything touching player */
function updateForceField(){
  if(!player.forceField)return;
  for(const e of enemies)if(dist2(e,player)<player.radius+e.radius+10){
    e.hp-=player.might*4*dt2;if(Math.random()<0.2)spawnParticles2(e.x,e.y,'#88f',1);
  }
}

/* Pet logic */
function updatePet(){
  if(save.selectedPet==='hachiko'&&save.pets.hachiko.unlocked){
    if(pet.state==='orbit'){
      pet.angle+=2.5*dt2;
      pet.x=player.x+Math.cos(pet.angle)*55;
      pet.y=player.y+Math.sin(pet.angle)*55;
      pet.timer+=dt2;
      if(pet.timer>=2){
        pet.timer=0;
        // find nearest enemy
        let near=null,nd=Infinity;
        for(const e of enemies){const d=distXY(pet.x,pet.y,e.x,e.y);if(d<nd&&d<300){nd=d;near=e;}}
        if(near){pet.target=near;pet.state='dash';}
      }
    } else if(pet.state==='dash'){
      const t=pet.target;
      if(!t||enemies.indexOf(t)===-1){pet.state='return';return;}
      const a=Math.atan2(t.y-pet.y,t.x-pet.x);
      pet.x+=Math.cos(a)*450*dt2;pet.y+=Math.sin(a)*450*dt2;
      if(distXY(pet.x,pet.y,t.x,t.y)<t.radius+10){
        applyDmg(t,8*player.might,'hachiko');
        spawnParticles2(pet.x,pet.y,'#fa0',5);
        pet.state='return';
      }
    } else { // return
      const a=Math.atan2(player.y-pet.y,player.x-pet.x);
      pet.x+=Math.cos(a)*400*dt2;pet.y+=Math.sin(a)*400*dt2;
      if(distXY(pet.x,pet.y,player.x,player.y)<60){pet.state='orbit';pet.timer=0;}
    }
  } else if(save.selectedPet==='frog'&&save.pets.frog.unlocked){
    pet.timer+=dt2;
    pet.hopT+=dt2*4;
    // Find nearest gem
    let near=null,nd=Infinity;
    for(const g of gems){const d=distXY(pet.x,pet.y,g.x,g.y);if(d<nd){nd=d;near=g;}}
    if(near&&nd>10){
      const a=Math.atan2(near.y-pet.y,near.x-pet.x);
      pet.x+=Math.cos(a)*250*dt2;pet.y+=Math.sin(a)*250*dt2;
      // Hop animation
      pet.vy=Math.abs(Math.sin(pet.hopT))*8;
      // Collect on touch
      if(distXY(pet.x,pet.y,near.x,near.y)<14){
        player.xp+=near.value;
        gems.splice(gems.indexOf(near),1);
        while(player.xp>=player.xpToNext){player.xp-=player.xpToNext;player.level++;player.xpToNext=Math.floor(player.xpToNext*1.4)+5;pendingLvl++;}
      }
    } else {
      // follow player
      const a=Math.atan2(player.y-pet.y,player.x-pet.x);
      const d=distXY(pet.x,pet.y,player.x,player.y);
      if(d>50){pet.x+=Math.cos(a)*150*dt2;pet.y+=Math.sin(a)*150*dt2;}
      pet.vy=0;
    }
  }
}

function readyEvolutions(){
  // Returns array of evolutions ready to fire (sub-skill ★5 + matching aux owned)
  const ready=[];
  for(const evo of EVOLUTIONS){
    const w=getW(evo.weapon),p=getP(evo.passive);
    if(w&&w.lv>=5&&p&&!w.evolvedDone)ready.push({...evo,w,p});
  }
  return ready;
}
function evolutionReady(){return readyEvolutions().length>0;}

function pickChoices(){
  // If an evolution is ready: dedicated EVOLVE choice as the only card
  const ready=readyEvolutions();
  if(ready.length>0){
    const evo=ready[0];const d=WEAPON_DEFS[evo.evolved];
    levelUpChoices=[{type:'evolve',tag:'⚡ EVOLVE!',name:d.name,desc:d.desc(),color:d.color,icon:d.icon,evolve:true,
      apply:()=>{
        evo.w.id=evo.evolved;evo.w.lv=1;evo.w.timer=0;evo.w.evolvedDone=true;
        weaponProjectiles=[];
        save.records.totalEvolutions++;saveSave();
        SFX.evolution();flashAstralForge(3);
      }}];
    selectedChoice=-1;return;
  }
  const ch=[];
  // Sub-skill ★UP (skip the main weapon — that's controlled from the Characters slot only)
  for(const w of player.weapons){
    if(w.id===player.mainWeaponId)continue;
    const d=WEAPON_DEFS[w.id];
    if(!d||!d.sub||d.evolved||w.lv>=d.maxLv)continue;
    const ns=w.lv+1;
    ch.push({type:'weapon',weaponId:w.id,tag:`⭐ STAR UP → ★${ns}`,name:d.name,desc:d.desc(ns),color:d.color,icon:d.icon,star:ns,apply:()=>{w.lv++;}});
  }
  // NEW SUB SKILL pool — only the 6 sub-skills enter the level-up trio
  if(player.weapons.length<7){
    const owned=new Set(player.weapons.map(w=>w.id));
    const BATTLE_NEW_SKILL_POOL=['molotov','boomerang','garlic','bible','lightning','drone'];
    for(const id of BATTLE_NEW_SKILL_POOL){
      if(!owned.has(id)){const d=WEAPON_DEFS[id];
        ch.push({type:'weapon',weaponId:id,tag:'NEW SKILL',name:d.name,desc:d.desc(1),color:d.color,icon:d.icon,star:1,
          apply:()=>{player.weapons.push({id,lv:1,timer:0});if(!save.records.weaponsUsed)save.records.weaponsUsed=[];if(!save.records.weaponsUsed.includes(id))save.records.weaponsUsed.push(id);}});
      }
    }
  }
  // Aux (single-pick)
  if(player.passives.length<6){
    const owned=new Set(player.passives.map(p=>p.id));
    for(const id of Object.keys(PASSIVE_DEFS)){
      if(!owned.has(id)){const d=PASSIVE_DEFS[id];
        const evolveTag=d.evolveTarget&&WEAPON_DEFS[d.evolveTarget]?` [EVO: ${WEAPON_DEFS[d.evolveTarget].icon} ${WEAPON_DEFS[d.evolveTarget].name}]`:'';
        ch.push({type:'passive',tag:'PASSIVE',name:d.name,desc:d.desc()+evolveTag,color:d.color,icon:d.icon,evolveTarget:d.evolveTarget,apply:()=>{player.passives.push({id,lv:1});d.apply(player);}});
      }
    }
  }
  // Status-up choices
  ch.push({type:'stat',tag:'STAT UP',name:'+10% Speed',desc:'Move faster',color:'#8ff',icon:'👟',apply:()=>{player.baseSpeed*=1.1;player.speed*=1.1;}});
  ch.push({type:'stat',tag:'STAT UP',name:'+20% MaxHP',desc:'Heal +20% & raise cap',color:'#f88',icon:'❤️',apply:()=>{const inc=Math.floor(player.maxHp*0.2);player.maxHp+=inc;player.hp=Math.min(player.maxHp,player.hp+inc);}});
  ch.push({type:'stat',tag:'STAT UP',name:'+15% XP Gain',desc:'Faster level up',color:'#0af',icon:'⭐',apply:()=>{player.xpMult*=1.15;}});
  ch.push({type:'stat',tag:'STAT UP',name:'+25% Magnet',desc:'Larger XP pickup',color:'#0ff',icon:'🧲',apply:()=>{player.magnetRange*=1.25;}});
  // Heal
  if(player.hp<player.maxHp*.9)ch.push({type:'heal',tag:'HEAL',name:'Heal',desc:'+30 HP',color:'#4f4',icon:'❤️',apply:()=>{player.hp=Math.min(player.hp+30,player.maxHp);}});
  ch.sort(()=>Math.random()-.5);
  levelUpChoices=ch.slice(0,3);selectedChoice=-1;
}

function openChest2(){
  // Boss chest just gives a level-up window now (evolution flows via pickChoices)
  pickChoices();bState='levelup';SFX.levelUp();
}

/* Update */
function updateBattle(){
  if(bState!=='playing')return;
  const chap=CHAPTER_DEFS[save.selectedChapter];
  const clearTime=chap.time;

  let dx=0,dy=0;
  if(keys.w||keys.W||keys.ArrowUp)dy=-1;
  if(keys.s||keys.S||keys.ArrowDown)dy=1;
  if(keys.a||keys.A||keys.ArrowLeft){dx=-1;player.facing=-1;}
  if(keys.d||keys.D||keys.ArrowRight){dx=1;player.facing=1;}
  if(joyDx||joyDy){dx=joyDx;dy=joyDy;if(dx<0)player.facing=-1;if(dx>0)player.facing=1;}
  const mag=Math.sqrt(dx*dx+dy*dy);if(mag>1){dx/=mag;dy/=mag;}
  if(dx||dy){player.lastDx=dx;player.lastDy=dy;}
  playerMoving=(dx!==0||dy!==0);
  player.x+=dx*player.speed*dt2;player.y+=dy*player.speed*dt2;
  camera.x=player.x-W/2;camera.y=player.y-H/2;
  if(playerDmgFlash>0)playerDmgFlash-=dt2;
  if(levelUpFlash>0)levelUpFlash-=dt2;

  gameTime+=dt2;

  // Records: track playtime
  save.records.totalPlayTime+=dt2;
  // periodic save
  if(Math.floor(gameTime*2)%20===0&&Math.abs((gameTime*2)-Math.round(gameTime*2))<0.05)saveSave();

  let regen=player.hpRegen;
  player.hp=Math.min(player.hp+regen*dt2,player.maxHp);
  if(player.invTimer>0)player.invTimer-=dt2;

  // Wave (start at minute 1)
  const curMin=Math.floor(gameTime/60);
  if(curMin!==lastWaveMin&&curMin>=1){
    lastWaveMin=curMin;
    waveText=getWaveName(curMin);waveTimer=3;
    const ht=getHordeType(curMin);
    for(let i=0;i<15;i++)spawnEnemy2(ht);
    // Every odd minute from 2: spawn 1-3 elites
    if(curMin>=2){
      const eliteTypes=['armorZombie','ghost','demon'].filter(t=>ENEMY_TYPES[t]);
      const n=Math.min(3,1+Math.floor(curMin/4));
      for(let i=0;i<n;i++)spawnEnemy2(eliteTypes[Math.floor(Math.random()*eliteTypes.length)],{elite:true});
    }
  }
  if(waveTimer>0)waveTimer-=dt2;

  // Bosses
  for(let i=0;i<BOSS_SCHEDULE.length;i++){
    const sc=BOSS_SCHEDULE[i];
    if(gameTime>=sc.time&&!bossesSpawned.includes(i)){
      bossesSpawned.push(i);
      spawnBossByKey(sc.key);SFX.bossSpawn();
      bgmStartBoss(save.selectedChapter);
    }
  }

  // Death warning starts 30 sec before death
  const deathSpawnTime=Math.max(clearTime+10,1800);
  if(gameTime>=deathSpawnTime-30&&!deathEntity)deathWarnTimer=Math.max(deathWarnTimer,deathSpawnTime-gameTime);
  if(gameTime>=deathSpawnTime&&!deathEntity){
    const a=Math.random()*Math.PI*2;
    deathEntity={x:player.x+Math.cos(a)*900,y:player.y+Math.sin(a)*900,radius:35,speed:50};
  }
  if(deathEntity){
    const a=Math.atan2(player.y-deathEntity.y,player.x-deathEntity.x);
    deathEntity.x+=Math.cos(a)*deathEntity.speed*dt2;deathEntity.y+=Math.sin(a)*deathEntity.speed*dt2;
    if(distXY(deathEntity.x,deathEntity.y,player.x,player.y)<deathEntity.radius+player.radius){player.hp=0;bState='done';endBattle(false);return;}
  }

  // Clear check
  if(gameTime>=clearTime&&!bossActive){bState='done';endBattle(true);return;}

  // Boss victory: 2s fanfare → win screen
  if(bossVictoryT>0){
    bossVictoryT-=dt2;
    if(bossVictoryT<=0){bState='done';endBattle(true,true);return;}
    // Spawn explosion particles during fanfare
    if(Math.random()<0.5)spawnParticles2(bossVictoryX+rnd(-200,200),bossVictoryY+rnd(-150,150),['#fc0','#ff0','#fff','#fa0'][Math.floor(Math.random()*4)],3);
  }

  updateWeapons();updateOrbits();updateFireZones();updateBurns();updatePoison();updateForceField();updatePet();

  // Spawn
  const tf=Math.min(gameTime/clearTime,1);
  const si=Math.max(.12,1.2-tf*1);
  enemySpawnTimer+=dt2;
  while(enemySpawnTimer>=si){enemySpawnTimer-=si;
    const types=getWaveTypes(curMin);const cnt=1+Math.floor(tf*2);
    for(let i=0;i<cnt;i++)spawnEnemy2(types[Math.floor(Math.random()*types.length)]);
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.homing){
      let n=null,nd=Infinity;
      for(const e of enemies){const d=distXY(b.x,b.y,e.x,e.y);if(d<nd&&d<400){nd=d;n=e;}}
      if(n){
        const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        const ta=Math.atan2(n.y-b.y,n.x-b.x);
        const ca=Math.atan2(b.vy,b.vx);
        let da=ta-ca;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
        const turn=Math.max(-3*dt2,Math.min(3*dt2,da));
        const na=ca+turn;
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;b.angle=na;
      }
    }
    // Boomerang: fly out then return to player
    if(b.kind==='boomerang'){
      b.spinT=(b.spinT||0)+dt2;
      if(b.phase==='out'){
        // After 0.6s or when slowing, switch to return
        b.life=Math.max(b.life,0.5);
        if(b.spinT>0.6){b.phase='return';}
      } else {
        const a=Math.atan2(player.y-b.y,player.x-b.x);
        const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        const targetSp=Math.max(sp,360);
        b.vx=Math.cos(a)*targetSp;b.vy=Math.sin(a)*targetSp;
        // Catch when close to player
        if(distXY(b.x,b.y,player.x,player.y)<player.radius+10&&!b.homing){bullets.splice(i,1);continue;}
      }
    }
    // Blackhole: decelerate, pull enemies, burst on ttl
    if(b.kind==='blackhole'){
      b.vx*=0.94;b.vy*=0.94;
      for(const e of enemies){
        const d=distXY(b.x,b.y,e.x,e.y);
        if(d<b.pull&&d>2){
          const a=Math.atan2(b.y-e.y,b.x-e.x);
          e.x+=Math.cos(a)*180*dt2;e.y+=Math.sin(a)*180*dt2;
        }
      }
      b.ttl-=dt2;
      if(b.ttl<=0){
        // Burst
        for(const e of enemies)if(distXY(b.x,b.y,e.x,e.y)<b.burstR){
          applyDmg(e,b.burstDmg,b.wid);
        }
        lightningFx.push({x:b.x,y:b.y,life:.4,maxLife:.4,kind:'explosion'});
        for(let p=0;p<14;p++)particles.push({x:b.x,y:b.y,vx:rnd(-200,200),vy:rnd(-200,200),life:.5,maxLife:.6,radius:3,color:'#a0f'});
        bullets.splice(i,1);continue;
      }
    }
    b.x+=b.vx*dt2;b.y+=b.vy*dt2;b.life-=dt2;
    if(b.life<=0){bullets.splice(i,1);continue;}
    // Soccer/drill bounce on far edge of camera
    if((b.kind==='soccer'||b.kind==='drill')&&b.bounces>0){
      const margin=20;
      let bounced=false;
      if(b.x<camera.x+margin||b.x>camera.x+W-margin){b.vx=-b.vx;b.x=Math.max(camera.x+margin,Math.min(camera.x+W-margin,b.x));bounced=true;}
      if(b.y<camera.y+margin||b.y>camera.y+H-margin){b.vy=-b.vy;b.y=Math.max(camera.y+margin,Math.min(camera.y+H-margin,b.y));bounced=true;}
      if(bounced){
        b.bounces--;
        if(b.bounceTeleport){
          // Teleport to nearest enemy
          let n=null,nd=Infinity;
          for(const e of enemies){const d=distXY(b.x,b.y,e.x,e.y);if(d<nd){nd=d;n=e;}}
          if(n){const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
            const a=Math.atan2(n.y-b.y,n.x-b.x);
            b.x=n.x-Math.cos(a)*40;b.y=n.y-Math.sin(a)*40;
            b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;}
        }
      }
    }
    for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];
      if(dist2(b,e)<b.radius+e.radius){
        applyDmg(e,b.damage,b.wid);
        if(b.vx||b.vy){const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);if(sp>0){e.kbx=(b.vx/sp)*22;e.kby=(b.vy/sp)*22;e.kbT=0.1;}}
        SFX.hit();
        if(b.slow)e.speed=Math.max(e.speed*0.3,5);
        // Skill-specific hit FX
        if(b.wid==='spiritBlade'){
          for(let s=0;s<6;s++){const ang=(Math.PI*2/6)*s;
            particles.push({x:e.x,y:e.y,vx:Math.cos(ang)*80,vy:Math.sin(ang)*80,life:.4,maxLife:.5,radius:3,color:'#88ddff'});}
        } else if(b.wid==='hyperShot'){
          // AoE explosion + visual
          lightningFx.push({x:e.x,y:e.y,life:.35,maxLife:.35,kind:'explosion'});
          for(const e2 of enemies)if(e2!==e&&distXY(e.x,e.y,e2.x,e2.y)<60){e2.hp-=b.damage*0.5;e2.flashTimer=.06;}
        } else if(b.wid==='destroyer'){
          for(let s=0;s<8;s++)particles.push({x:e.x,y:e.y,vx:rnd(-100,100),vy:rnd(-100,100),life:.4,maxLife:.5,radius:3,color:'#fc0'});
        }
        // Weapon-purple: 10% slow on hit
        if(player.gskills.weapon&&player.gskills.weapon.ri>=3&&Math.random()<0.1)e.speed=Math.max(e.speed*0.5,5);
        // Weapon-gold: 0.5% chest drop on hit (if not boss; chest only for non-boss not allowed normally)
        if(player.gskills.weapon&&player.gskills.weapon.ri>=4&&Math.random()<0.005&&!e.isBoss)chests2.push({x:e.x,y:e.y,radius:18,bob:0});
        b.pierce--;
        if(b.pierce<=0){bullets.splice(i,1);break;}
      }
    }
  }

  // Enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];const td=ENEMY_TYPES[e.typeId];
    // Apply knockback before normal movement
    if(e.kbT>0){e.x+=e.kbx*dt2*10;e.y+=e.kby*dt2*10;e.kbT-=dt2;}
    else if(td&&td.move)td.move(e,player.x,player.y);
    else{const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt2;e.y+=Math.sin(a)*e.speed*dt2;}
    e.flashTimer=Math.max(0,e.flashTimer-dt2);

    if(e.hp<=0){
      spawnParticles2(e.x,e.y,'#fa0',e.isBoss?20:6);runKills++;
      deadFx.push({x:e.x,y:e.y,life:0.3,maxLife:0.3,sprite:e.isBoss?'boss_zombie':'enemy_'+e.typeId,radius:e.radius,color:e.color});
      // Armor-gold: +1 HP per kill
      if(player.gskills&&player.gskills.armor&&player.gskills.armor.ri>=4)player.hp=Math.min(player.maxHp,player.hp+1);
      gems.push({x:e.x,y:e.y,radius:e.isBoss?8:5,value:Math.ceil(e.xpValue*player.xpMult),bob:Math.random()*6});
      // Coins: 3% normal, elite always, boss always
      const coinChance=(e.isBoss||e.isElite)?1:.03*chap.coinMult*(1+(player.coinBonus||0));
      if(Math.random()<coinChance){
        let coinVal=e.isBoss?Math.floor(rnd(50,100)*chap.coinMult):e.isElite?Math.floor(rnd(8,15)*chap.coinMult):Math.ceil(rnd(1,3)*chap.coinMult);
        if(player.commonCoinBonus&&Math.random()<.05)coinVal*=2;
        coins2.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),radius:4,value:coinVal,bob:Math.random()*6});
      }
      // Equipment drop
      if(e.isBoss){
        // boss = blue+ guaranteed
        const slots=Object.keys(SLOT_NAMES);const sl=slots[Math.floor(Math.random()*slots.length)];
        const ri=2+Math.floor(Math.random()*3); // blue/purple/gold
        if(save.equipment.length<50){const id=makeEquip(sl,RANKS[ri]);const eq=getEqById(id);runEquipsDropped.push(eq);queueEquipPopup(eq);}
      } else if(Math.random()<.01){
        // 1% normal drop = gray
        const slots=Object.keys(SLOT_NAMES);const sl=slots[Math.floor(Math.random()*slots.length)];
        if(save.equipment.length<50){const id=makeEquip(sl,'gray');const eq=getEqById(id);runEquipsDropped.push(eq);queueEquipPopup(eq);}
      }
      if(e.isBoss){
        chests2.push({x:e.x,y:e.y,radius:18,bob:0});
        if(bossActive===e)bossActive=null;
        save.records.bossesKilled=(save.records.bossesKilled||0)+1;
        bgmStopBoss();
        // Trigger boss-victory fanfare → result screen
        bossVictoryT=2.0;bossVictoryX=e.x;bossVictoryY=e.y;
      }
      // Energy drink: 0.2% normal, 4% elite, 50% boss
      const edChance=e.isBoss?0.5:e.isElite?0.04:0.002;
      if(Math.random()<edChance)energyDrinks.push({x:e.x,y:e.y,radius:11,bob:Math.random()*6});
      enemies.splice(i,1);continue;
    }
    if(dist2(e,player)<e.radius+player.radius&&player.invTimer<=0){
      let dmg=e.damage-player.armor;dmg*=(1-player.knightReduction);if(dmg<1)dmg=1;
      player.hp-=dmg;
      // Armor-blue: 2s i-frames
      player.invTimer=(player.gskills&&player.gskills.armor&&player.gskills.armor.ri>=2)?2:.5;
      spawnParticles2(player.x,player.y,'#f44',4);
      playerDmgFlash=0.2;SFX.damage();
      if(player.hp<=0){player.hp=0;bState='done';endBattle(false);return;}
    }
  }
  enemies=enemies.filter(e=>e.isBoss||dist2(e,player)<1200);

  // Gems
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i];g.bob+=dt2*3;const d=dist2(g,player);
    if(d<player.magnetRange){const a=Math.atan2(player.y-g.y,player.x-g.x);g.x+=Math.cos(a)*350*dt2;g.y+=Math.sin(a)*350*dt2;}
    if(d<player.radius+g.radius+5){
      player.xp+=g.value;gems.splice(i,1);
      while(player.xp>=player.xpToNext){player.xp-=player.xpToNext;player.level++;player.xpToNext=Math.floor(player.xpToNext*1.4)+5;pendingLvl++;}
      if(pendingLvl>0){pendingLvl--;pickChoices();bState='levelup';SFX.levelUp();levelUpFlash=0.6;runLevelUps++;return;}
    }
  }
  for(let i=coins2.length-1;i>=0;i--){
    const c=coins2[i];c.bob+=dt2*4;const d=dist2(c,player);
    if(d<80){const a=Math.atan2(player.y-c.y,player.x-c.x);c.x+=Math.cos(a)*250*dt2;c.y+=Math.sin(a)*250*dt2;}
    if(d<player.radius+c.radius+5){runGold+=c.value;coins2.splice(i,1);SFX.coin();}
  }
  for(let i=chests2.length-1;i>=0;i--){
    const c=chests2[i];c.bob+=dt2*2;
    if(dist2(c,player)<player.radius+c.radius+12){chests2.splice(i,1);openChest2();return;}
  }
  // Energy drinks: pickup → reset all skills
  for(let i=energyDrinks.length-1;i>=0;i--){
    const d=energyDrinks[i];d.bob+=dt2*3;
    if(dist2(d,player)<player.radius+d.radius+6){
      energyDrinks.splice(i,1);
      player.weapons=[];player.passives=[];weaponProjectiles=[];
      player.cdReduction=player.baseCdReduction;player.might=player.baseMight;
      player.maxHp=player.baseMaxHp;player.hp=Math.min(player.hp,player.maxHp);
      player.xpMult=1+(getEquippedBonus('XP Gain'))/100;player.droneLock=false;player.forceField=false;
      resetFlash=2.0;SFX.evolution();
      pendingLvl++; // Trigger immediate level-up to repick
      pickChoices();bState='levelup';return;
    }
  }
  if(resetFlash>0)resetFlash-=dt2;
  for(let i=lightningFx.length-1;i>=0;i--){lightningFx[i].life-=dt2;if(lightningFx[i].life<=0)lightningFx.splice(i,1);}
  for(let i=whipFx.length-1;i>=0;i--){whipFx[i].life-=dt2;if(whipFx[i].life<=0)whipFx.splice(i,1);}
  for(let i=dmgPopups.length-1;i>=0;i--){dmgPopups[i].life-=dt2;dmgPopups[i].y-=45*dt2;if(dmgPopups[i].life<=0)dmgPopups.splice(i,1);}
  for(let i=deadFx.length-1;i>=0;i--){deadFx[i].life-=dt2;if(deadFx[i].life<=0)deadFx.splice(i,1);}
  for(let i=equipPopups.length-1;i>=0;i--){equipPopups[i].life-=dt2;if(equipPopups[i].life<=0)equipPopups.splice(i,1);}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt2;p.y+=p.vy*dt2;p.vx*=.94;p.vy*=.94;p.life-=dt2;if(p.life<=0)particles.splice(i,1);}
}

/* Draw enemy */
function drawEnemy(e){
  const td=ENEMY_TYPES[e.typeId];

  // Per-type bob amplitude/speed
  const bobCfg={zombie:[2.5,2.5],skeleton:[2,4],armorZombie:[1.5,2],ghost:[7,3.5],demon:[2,7]};
  const bc=bobCfg[e.typeId]||[2,3];
  const eBob=Math.sin(gameTime*bc[1]+e.st*5)*bc[0];

  // Try sprite first
  if(!e.isBoss){
    const sp=SPRITES['enemy_'+e.typeId];
    if(sp){
      const sz=e.radius*2.6;
      if(e.typeId==='ghost')ctx.globalAlpha=0.75+Math.sin(gameTime*3+e.st)*0.15;
      if(e.flashTimer>0)ctx.filter='brightness(3) saturate(0)';
      if(e.isElite){ctx.shadowColor='#ff0';ctx.shadowBlur=18;}
      if(e.poisoned>0){ctx.filter='hue-rotate(80deg) saturate(1.5)';}
      ctx.drawImage(sp,e.x-sz/2,e.y-sz/2+eBob,sz,sz);
      if(e.poisoned>0)ctx.filter='none';
      ctx.shadowBlur=0;
      if(e.flashTimer>0)ctx.filter='none';
      ctx.globalAlpha=1;
      if(e.hp<e.maxHp){
        const r=Math.max(0,e.hp/e.maxHp);
        ctx.fillStyle='#333';ctx.fillRect(e.x-(e.isElite?22:15),e.y-e.radius-7,e.isElite?44:30,3);
        ctx.fillStyle=e.isElite?'#ff0':'#f44';ctx.fillRect(e.x-(e.isElite?22:15),e.y-e.radius-7,(e.isElite?44:30)*r,3);
      }
      if(e.isElite&&e.eliteName){
        ctx.fillStyle='#ff0';ctx.font='bold 11px monospace';ctx.textAlign='center';
        ctx.strokeStyle='#000';ctx.lineWidth=3;
        ctx.strokeText(e.eliteName,e.x,e.y-e.radius-12);
        ctx.fillText(e.eliteName,e.x,e.y-e.radius-12);
      }
      return;
    }
  }

  // Boss with sprite
  if(e.isBoss){
    const sp=SPRITES['boss_zombie'];
    if(sp){
      const sz=e.radius*2.4;
      const wobble=Math.sin(gameTime*3+e.st)*4;
      // Outline glow
