      let outline=e.outline||e.color;
      if(e.rainbow)outline=`hsl(${(gameTime*120)%360},100%,55%)`;
      ctx.shadowColor=outline;ctx.shadowBlur=22;
      if(e.flashTimer>0)ctx.filter='brightness(3) saturate(0)';
      ctx.drawImage(sp,e.x-sz/2,e.y-sz/2+wobble,sz,sz);
      if(e.flashTimer>0)ctx.filter='none';
      ctx.shadowBlur=0;
      // Rainbow ring for final boss
      if(e.rainbow){
        ctx.strokeStyle=outline;ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(e.x,e.y+wobble,e.radius+4,0,Math.PI*2);ctx.stroke();
      }
      // Wings overlay for demon king
      if(e.hasWings){
        ctx.fillStyle='#600';
        ctx.beginPath();ctx.ellipse(e.x-sz/2-15,e.y+wobble,18,sz/2.5,Math.PI/4,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(e.x+sz/2+15,e.y+wobble,18,sz/2.5,-Math.PI/4,0,Math.PI*2);ctx.fill();
      }
      // Boss name
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText(e.bossName||'BOSS',e.x,e.y+e.radius+18);
      return;
    }
  }

  if(td&&td.alpha)ctx.globalAlpha=td.alpha+Math.sin(gameTime*3+e.st)*0.15;
  if(e.isBoss){
    // Rainbow outline blink for final boss
    let outline=e.outline||e.color;
    if(e.rainbow){outline=`hsl(${(gameTime*120)%360},100%,55%)`;}
    ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
    ctx.shadowColor=outline;ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    if(outline){ctx.strokeStyle=outline;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,e.radius+2,0,Math.PI*2);ctx.stroke();}
    // Wings for demon king
    if(e.hasWings){
      ctx.fillStyle='#600';
      ctx.beginPath();
      ctx.ellipse(e.x-e.radius-15,e.y,18,e.radius*.7,Math.PI/4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();
      ctx.ellipse(e.x+e.radius+15,e.y,18,e.radius*.7,-Math.PI/4,0,Math.PI*2);ctx.fill();
    }
    // Eyes
    const er=e.radius*.3;ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(e.x-er,e.y-er*.5,er*.4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.x+er,e.y-er*.5,er*.4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f00';
    ctx.beginPath();ctx.arc(e.x-er,e.y-er*.5,er*.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(e.x+er,e.y-er*.5,er*.2,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
    ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.fill();
    if(td&&td.outline){ctx.strokeStyle=td.outline;ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.stroke();}
    if(e.typeId==='zombie'){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-3,e.y-2,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e.x+3,e.y-2,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(e.x-3,e.y-2,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e.x+3,e.y-2,1,0,Math.PI*2);ctx.fill();
    } else if(e.typeId==='skeleton'){
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(e.x-3,e.y-2,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(e.x+3,e.y-2,2,0,Math.PI*2);ctx.fill();
    } else if(e.typeId==='armorZombie'){
      ctx.strokeStyle='#ff0';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(e.x-7,e.y-2);ctx.lineTo(e.x+7,e.y-2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(e.x,e.y-9);ctx.lineTo(e.x,e.y+5);ctx.stroke();
    } else if(e.typeId==='ghost'){
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(e.x-4,e.y-3,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+4,e.y-3,2.5,0,Math.PI*2);ctx.fill();
    } else if(e.typeId==='demon'){
      ctx.fillStyle=e.flashTimer>0?'#fff':'#900';
      ctx.beginPath();ctx.moveTo(e.x-7,e.y-e.radius+2);ctx.lineTo(e.x-10,e.y-e.radius-7);ctx.lineTo(e.x-3,e.y-e.radius);ctx.fill();
      ctx.beginPath();ctx.moveTo(e.x+7,e.y-e.radius+2);ctx.lineTo(e.x+10,e.y-e.radius-7);ctx.lineTo(e.x+3,e.y-e.radius);ctx.fill();
      ctx.fillStyle='#ff0';
      ctx.beginPath();ctx.arc(e.x-4,e.y-2,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+4,e.y-2,2,0,Math.PI*2);ctx.fill();
    }
    if(e.hp<e.maxHp){
      const r=Math.max(0,e.hp/e.maxHp);
      ctx.fillStyle='#333';ctx.fillRect(e.x-15,e.y-e.radius-7,30,3);
      ctx.fillStyle='#f44';ctx.fillRect(e.x-15,e.y-e.radius-7,30*r,3);
    }
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const blink=player.invTimer>0&&Math.floor(player.invTimer*10)%2;
  if(blink)return;
  const ch=CHARS[player.charId];
  const sp=SPRITES['char_'+player.charId];
  const bob=playerMoving?Math.sin(gameTime*9)*3:0;
  if(sp){
    const sz=52;
    ctx.strokeStyle=ch.outline;ctx.lineWidth=2;ctx.globalAlpha=0.5;
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius+4,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
    if(playerDmgFlash>0)ctx.filter=`drop-shadow(0 0 8px #f00) brightness(1.4) sepia(1) hue-rotate(-50deg) saturate(8)`;
    if(player.facing<0){
      ctx.save();ctx.translate(player.x,player.y+bob);ctx.scale(-1,1);
      ctx.drawImage(sp,-sz/2,-sz/2,sz,sz);ctx.restore();
    } else {
      ctx.drawImage(sp,player.x-sz/2,player.y-sz/2+bob,sz,sz);
    }
    if(playerDmgFlash>0)ctx.filter='none';
  } else {
    ctx.strokeStyle=ch.outline;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius+2,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=ch.color;
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 18px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ch.letter,player.x,player.y+1);
    ctx.textBaseline='alphabetic';
  }
}

/* Deterministic tile hash so decorations stay fixed in world space */
function tileHash(tx,ty,salt){let h=(tx*73856093)^(ty*19349663)^((salt||0)*83492791);h=(h^0x9E3779B1)|0;return((h>>>0)%100000)/100000;}

const MAP_RENDERERS={
  1:function(){
    const TS=80;
    ctx.fillStyle='#2d5a27';ctx.fillRect(camera.x,camera.y,W,H);
    const sx=Math.floor(camera.x/TS)-1,sy=Math.floor(camera.y/TS)-1;
    const ex=Math.ceil((camera.x+W)/TS)+1,ey=Math.ceil((camera.y+H)/TS)+1;
    for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
      const h=tileHash(tx,ty,1);const wx=tx*TS,wy=ty*TS;
      ctx.fillStyle=h<0.35?'#2d5a27':'#3a7a30';ctx.fillRect(wx,wy,TS,TS);
      // Grass tufts
      if(h>0.4&&h<0.55){ctx.fillStyle='#1f4a1c';ctx.fillRect(wx+12,wy+30,3,6);ctx.fillRect(wx+18,wy+34,3,5);ctx.fillRect(wx+50,wy+12,3,6);}
      // Tree
      if(h>0.92){const cx=wx+TS/2,cy=wy+TS/2;
        ctx.fillStyle='#5a3a1a';ctx.fillRect(cx-4,cy,8,18);
        ctx.fillStyle='#1f5a17';ctx.beginPath();ctx.arc(cx,cy-4,16,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#287025';ctx.beginPath();ctx.arc(cx-6,cy-7,9,0,Math.PI*2);ctx.fill();
      }
      // Gravestone
      else if(h>0.85){const cx=wx+TS/2,cy=wy+TS/2;
        ctx.fillStyle='#666';ctx.fillRect(cx-9,cy-4,18,18);
        ctx.fillStyle='#888';ctx.fillRect(cx-9,cy-4,18,3);
        ctx.fillStyle='#333';ctx.fillRect(cx-1,cy+1,2,9);ctx.fillRect(cx-4,cy+4,8,2);
      }
    }
  },
  2:function(){
    const TS=80;
    ctx.fillStyle='#1a1a2e';ctx.fillRect(camera.x,camera.y,W,H);
    const sx=Math.floor(camera.x/TS)-1,sy=Math.floor(camera.y/TS)-1;
    const ex=Math.ceil((camera.x+W)/TS)+1,ey=Math.ceil((camera.y+H)/TS)+1;
    for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
      const h=tileHash(tx,ty,2);const wx=tx*TS,wy=ty*TS;
      ctx.fillStyle='#2a2a3e';ctx.fillRect(wx,wy,TS,TS);
      ctx.strokeStyle='#333355';ctx.lineWidth=1;ctx.strokeRect(wx+0.5,wy+0.5,TS-1,TS-1);
      // Cracks
      if(h>0.55&&h<0.7){ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.moveTo(wx+15,wy+20);ctx.lineTo(wx+45,wy+55);ctx.lineTo(wx+60,wy+40);ctx.stroke();}
      // Water puddle
      else if(h>0.7&&h<0.83){ctx.fillStyle='rgba(40,90,180,0.55)';ctx.beginPath();ctx.ellipse(wx+TS/2,wy+TS/2,18,10,0,0,Math.PI*2);ctx.fill();}
      // Torch
      else if(h>0.92){const cx=wx+TS/2,cy=wy+TS/2;
        ctx.fillStyle='#3a2410';ctx.fillRect(cx-2,cy,4,18);
        const flick=0.7+Math.sin(gameTime*9+tx*3+ty)*0.3;
        ctx.fillStyle='#fa3';ctx.shadowColor='#f80';ctx.shadowBlur=18*flick;
        ctx.beginPath();ctx.ellipse(cx,cy-3,5,8*flick,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ff0';ctx.beginPath();ctx.ellipse(cx,cy-3,2.5,4*flick,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    // Vignette
    const vg=ctx.createRadialGradient(camera.x+W/2,camera.y+H/2,W*0.25,camera.x+W/2,camera.y+H/2,W*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.65)');
    ctx.fillStyle=vg;ctx.fillRect(camera.x,camera.y,W,H);
  },
  3:function(){
    const TS=80;
    ctx.fillStyle='#3d0000';ctx.fillRect(camera.x,camera.y,W,H);
    const sx=Math.floor(camera.x/TS)-1,sy=Math.floor(camera.y/TS)-1;
    const ex=Math.ceil((camera.x+W)/TS)+1,ey=Math.ceil((camera.y+H)/TS)+1;
    for(let ty=sy;ty<ey;ty++)for(let tx=sx;tx<ex;tx++){
      const h=tileHash(tx,ty,3);const wx=tx*TS,wy=ty*TS;
      ctx.fillStyle='#5a1a00';ctx.fillRect(wx,wy,TS,TS);
      ctx.fillStyle=h<0.4?'rgba(0,0,0,0.18)':'rgba(0,0,0,0)';ctx.fillRect(wx,wy,TS,TS);
      // Lava pool (animated)
      if(h>0.6&&h<0.78){const cx=wx+TS/2,cy=wy+TS/2;
        const wob=Math.sin(gameTime*2+tx+ty)*3;
        ctx.fillStyle='#f60';ctx.shadowColor='#f60';ctx.shadowBlur=12;
        ctx.beginPath();ctx.ellipse(cx,cy,22+wob,14,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fc0';ctx.beginPath();ctx.ellipse(cx,cy,12,7,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }
      // Fire pillar
      else if(h>0.93){const cx=wx+TS/2,cy=wy+TS/2;
        const flick=Math.sin(gameTime*6+tx*2+ty)*0.2+1;
        ctx.fillStyle='#900';ctx.beginPath();ctx.ellipse(cx,cy+10,12,4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#f30';ctx.shadowColor='#f60';ctx.shadowBlur=14;
        ctx.beginPath();ctx.moveTo(cx-10,cy+8);ctx.quadraticCurveTo(cx-6*flick,cy-15,cx,cy-25*flick);ctx.quadraticCurveTo(cx+6*flick,cy-15,cx+10,cy+8);ctx.closePath();ctx.fill();
        ctx.fillStyle='#fa0';ctx.beginPath();ctx.moveTo(cx-6,cy+5);ctx.quadraticCurveTo(cx-3,cy-8,cx,cy-18*flick);ctx.quadraticCurveTo(cx+3,cy-8,cx+6,cy+5);ctx.closePath();ctx.fill();
        ctx.fillStyle='#ff0';ctx.beginPath();ctx.ellipse(cx,cy-6,2,5,0,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    // Floating embers
    for(let i=0;i<22;i++){
      const sd=tileHash(Math.floor(camera.x/40)+i,Math.floor(camera.y/40)+i*7,9);
      const px=camera.x+(sd*W);
      const py=camera.y+H-((gameTime*40+sd*600)%H);
      ctx.fillStyle='rgba(255,140,40,0.8)';ctx.shadowColor='#f60';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(px,py,1.5+sd*1.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
    // Red fog overlay
    ctx.fillStyle='rgba(120,0,0,0.18)';ctx.fillRect(camera.x,camera.y,W,H);
  },
};

function drawBattle(){
  ctx.fillStyle='#12122a';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-camera.x,-camera.y);

  const mr=MAP_RENDERERS[save.selectedChapter]||MAP_RENDERERS[1];
  mr();

  // Garlic / Soul Eater aura
  const gw=getW('garlic')||getW('soulEater');
  if(gw){
    const isEv=gw.id==='soulEater';
    const r=(isEv?120:gw.lv?WEAPON_DEFS.garlic.radius[gw.lv-1]:60)*(player.areaMult||1);
    const wob=Math.sin(gameTime*3)*4;
    ctx.fillStyle=isEv?'rgba(0,255,0,0.10)':'rgba(255,255,255,0.10)';
    ctx.beginPath();ctx.arc(player.x,player.y,r+wob,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=isEv?'rgba(80,255,80,0.45)':'rgba(255,255,255,0.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(player.x,player.y,r+wob,0,Math.PI*2);ctx.stroke();
  }
  // Force-field aura (aux)
  if(player.forceField){
    ctx.globalAlpha=.12;ctx.fillStyle='#88f';
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius+12,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.4;ctx.strokeStyle='#aaf';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(player.x,player.y,player.radius+14+Math.sin(gameTime*4)*2,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Sword/katana arcs + sword aura rings
  for(const w of whipFx){
    const a=w.life/w.maxLife;
    if(w.arcAng!==undefined){
      // Directional 120° forward arc (katana/chaos)
      ctx.globalAlpha=a*0.7;
      ctx.strokeStyle=w.color;ctx.lineWidth=w.chaos?16:12;
      ctx.shadowColor=w.color;ctx.shadowBlur=w.chaos?22:14;
      ctx.beginPath();
      ctx.arc(player.x,player.y,w.area*0.7,w.arcAng-Math.PI/3,w.arcAng+Math.PI/3);
      ctx.stroke();ctx.shadowBlur=0;
    } else if(w.dir===0){
      // Full ring (sword aura / lightchaser ★5 / chaos)
      ctx.globalAlpha=a*0.65;
      ctx.strokeStyle=w.color;ctx.lineWidth=8;
      ctx.shadowColor=w.color;ctx.shadowBlur=18;
      ctx.beginPath();ctx.arc(player.x,player.y,w.area,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    } else {
      ctx.globalAlpha=a*.55;
      ctx.strokeStyle=w.color;ctx.lineWidth=12;
      ctx.beginPath();
      const startA=w.dir>0?-Math.PI/3:Math.PI*2/3;
      const endA=w.dir>0?Math.PI/3:Math.PI*4/3;
      ctx.arc(player.x,player.y,w.area*0.6,startA,endA);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  for(const c of chests2){const b=Math.sin(c.bob)*3;ctx.fillStyle='#fa0';ctx.strokeStyle='#840';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(c.x-14,c.y-12+b,28,24,4);ctx.fill();ctx.stroke();ctx.fillStyle='#ff0';ctx.fillRect(c.x-3,c.y-4+b,6,8);ctx.shadowColor='#fa0';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;}

  // Fire zones (molotov puddles)
  for(const z of fireZones){
    const a=Math.min(1,z.life);
    const wob=Math.sin(gameTime*6+z.x)*2;
    ctx.fillStyle=`rgba(255,80,0,${a*0.4})`;ctx.beginPath();ctx.arc(z.x,z.y,z.radius+wob,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(255,200,0,${a*0.6})`;ctx.beginPath();ctx.arc(z.x,z.y,z.radius*0.55,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`rgba(255,150,40,${a})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(z.x,z.y,z.radius,0,Math.PI*2);ctx.stroke();
  }
  for(const g of gems){const b=Math.sin(g.bob)*3;ctx.fillStyle='#0f6';ctx.shadowColor='#0f6';ctx.shadowBlur=5;ctx.beginPath();ctx.arc(g.x,g.y+b,g.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
  for(const d of energyDrinks){
    const b=Math.sin(d.bob)*3;
    ctx.fillStyle='#f44';ctx.shadowColor='#f44';ctx.shadowBlur=12;
    ctx.fillRect(d.x-6,d.y-9+b,12,18);
    ctx.fillStyle='#fff';ctx.fillRect(d.x-4,d.y-7+b,8,3);
    ctx.fillStyle='#ff0';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('⚡',d.x,d.y+4+b);
    ctx.shadowBlur=0;
  }
  for(const c of coins2){const b=Math.sin(c.bob)*2;ctx.fillStyle='#ff0';ctx.shadowColor='#ff0';ctx.shadowBlur=4;ctx.beginPath();ctx.arc(c.x,c.y+b,c.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}

  // Bullets
  for(const b of bullets){
    const isSpirit=b.wid==='spiritBlade';
    const isHyper=b.wid==='hyperShot';
    const isDestroyer=b.wid==='destroyer';
    if(b.kind==='kunai'){
      // Trail for spiritBlade
      if(isSpirit){
        for(let t=1;t<=5;t++){
          const tx=b.x-b.vx*t*0.012,ty=b.y-b.vy*t*0.012;
          ctx.fillStyle=`rgba(136,221,255,${0.4-t*0.06})`;
          ctx.beginPath();ctx.arc(tx,ty,4-t*0.5,0,Math.PI*2);ctx.fill();
        }
      }
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      const c=isSpirit?'#88ddff':'#ff0';
      ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=isSpirit?14:6;
      if(isSpirit){
        // Star shape
        ctx.beginPath();
        for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2===0?9:4;
          if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
          else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
        ctx.closePath();ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(6,0);ctx.lineTo(0,2);ctx.lineTo(-6,0);ctx.lineTo(0,-2);ctx.closePath();
        ctx.fill();
      }
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='pellet'){
      // shotgun/hyperShot/drone/destroyer
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      if(isHyper){
        // Orange flame trail
        for(let t=1;t<=4;t++){
          ctx.fillStyle=`rgba(255,${140-t*15},0,${0.5-t*0.1})`;
          ctx.beginPath();ctx.arc(-t*4,0,5-t*0.7,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#ff8800';ctx.shadowColor='#ff4400';ctx.shadowBlur=18;
        ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();
      } else if(isDestroyer){
        // White smoke trail
        for(let t=1;t<=4;t++){
          ctx.fillStyle=`rgba(255,255,255,${0.4-t*0.08})`;
          ctx.beginPath();ctx.arc(-t*5,0,4-t*0.5,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#fc0';ctx.shadowColor='#fa0';ctx.shadowBlur=14;
        ctx.fillRect(-5,-3,10,6);
      } else {
        ctx.fillStyle=b.color||'#fff';ctx.shadowColor=b.color||'#fff';ctx.shadowBlur=4;
        ctx.beginPath();ctx.arc(0,0,b.radius,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='arrow'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      ctx.fillStyle=b.color||'#fff';ctx.shadowColor=b.color||'#fff';ctx.shadowBlur=4;
      ctx.fillRect(-4,-1,8,2);
      ctx.beginPath();ctx.moveTo(4,-3);ctx.lineTo(8,0);ctx.lineTo(4,3);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='ray'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      const c=b.color||'#0ff';
      ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=12;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.stroke();
      ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(10,-3);ctx.lineTo(16,0);ctx.lineTo(10,3);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='wave'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      ctx.fillStyle=b.color||'#a0f';ctx.shadowColor=b.color||'#a0f';ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(0,0,b.radius,-Math.PI/2.5,Math.PI/2.5);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='blackhole'){
      const wob=Math.sin(gameTime*8)*2;
      ctx.fillStyle='rgba(160,0,255,0.28)';ctx.beginPath();ctx.arc(b.x,b.y,b.pull,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';ctx.shadowColor='#a0f';ctx.shadowBlur=22;
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius+wob,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#a0f';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius+5+wob,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    } else if(b.kind==='drill'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(gameTime*30);
      ctx.fillStyle=b.color||'#ccf';ctx.shadowColor='#fff';ctx.shadowBlur=10;
      ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,5);ctx.lineTo(-7,-5);ctx.closePath();ctx.fill();
      ctx.fillStyle='#888';ctx.fillRect(-9,-3,4,6);
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='boomerang'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spinT*15);
      ctx.fillStyle=b.color||'#a63';ctx.shadowColor='#fa0';ctx.shadowBlur=8;
      ctx.fillRect(-b.radius,-3,b.radius*2,6);
      ctx.fillRect(-3,-b.radius,6,b.radius*2);
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='missile'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle||0);
      // White smoke trail
      for(let t=1;t<=4;t++){ctx.fillStyle=`rgba(255,255,255,${0.4-t*0.08})`;ctx.beginPath();ctx.arc(-t*4,0,3-t*0.4,0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=10;
      ctx.fillRect(-3,-2,8,4);
      ctx.shadowBlur=0;ctx.restore();
    } else if(b.kind==='soccer'){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(gameTime*6);
      ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(0,0,b.radius,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      for(let p=0;p<5;p++){const a=p*Math.PI*2/5;ctx.beginPath();ctx.arc(Math.cos(a)*5,Math.sin(a)*5,2,0,Math.PI*2);ctx.fill();}
      ctx.shadowBlur=0;ctx.restore();
    } else {
      ctx.fillStyle=b.color||'#ff0';ctx.shadowColor=b.color||'#ff0';ctx.shadowBlur=5;
      ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }
  }

  // Bat / lucille / bible / unholyBible orbits
  const bw=getW('bat')||getW('lucille')||getW('bible')||getW('unholyBible');
  if(bw){
    const isLuc=bw.id==='lucille';
    const isBible=bw.id==='bible'||bw.id==='unholyBible';
    const c=isLuc?'#f44':WEAPON_DEFS[bw.id].color;
    for(const o of weaponProjectiles){
      if(isLuc&&Math.random()<0.6){
        particles.push({x:o.x+rnd(-4,4),y:o.y+rnd(-4,4),vx:rnd(-15,15),vy:rnd(-30,-10),
          life:.4,maxLife:.5,radius:3+Math.random()*2,color:`hsl(${10+Math.random()*30},100%,55%)`});
      }
      ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle*1.5);
      ctx.shadowColor=isLuc?'#f60':c;ctx.shadowBlur=isLuc?20:isBible?12:10;
      if(isBible){
        // Book: purple rect with white pages
        ctx.fillStyle=c;ctx.fillRect(-7,-9,14,18);
        ctx.fillStyle='#fff';ctx.fillRect(-5,-7,10,14);
        ctx.strokeStyle=c;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,7);ctx.stroke();
      } else {
        ctx.fillStyle=c;
        ctx.fillRect(-3,-12,6,24);
        ctx.fillRect(-7,-14,14,6);
      }
      ctx.shadowBlur=0;
      ctx.restore();
    }
  }
  // Destroyer / drone-A with autoLock: laser sight to nearest enemy
  if(getW('destroyer')||(getW('droneA')&&player.droneLock)){
    const tgt=nearestEnemy();
    if(tgt){
      const isD=!!getW('destroyer');
      const off=isD?{x:0,y:-30}:{x:-30,y:-20};
      const dx=player.x+off.x,dy=player.y+off.y;
      ctx.strokeStyle='rgba(255,40,40,0.55)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
      ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(tgt.x,tgt.y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle='rgba(255,40,40,0.85)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(tgt.x,tgt.y,12+Math.sin(gameTime*8)*2,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tgt.x-16,tgt.y);ctx.lineTo(tgt.x-8,tgt.y);ctx.moveTo(tgt.x+8,tgt.y);ctx.lineTo(tgt.x+16,tgt.y);
      ctx.moveTo(tgt.x,tgt.y-16);ctx.lineTo(tgt.x,tgt.y-8);ctx.moveTo(tgt.x,tgt.y+8);ctx.lineTo(tgt.x,tgt.y+16);ctx.stroke();
    }
  }

  // Lightning + hyperShot explosion
  const hasThunderWrath=!!getW('thunderWrath');
  for(const l of lightningFx){
    const a=l.life/l.maxLife;
    if(l.kind==='explosion'){
      // HyperShot orange AoE
      ctx.globalAlpha=a;
      const r=60*(1-a*0.5);
      ctx.fillStyle=`rgba(255,140,0,${a*0.6})`;ctx.beginPath();ctx.arc(l.x,l.y,r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(255,200,40,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(l.x,l.y,r,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;continue;
    }
    ctx.globalAlpha=a;
    // Hit flash
    ctx.fillStyle=hasThunderWrath?'rgba(255,255,255,0.6)':'rgba(255,255,200,0.4)';
    ctx.beginPath();ctx.arc(l.x,l.y,(hasThunderWrath?42:30)*a,0,Math.PI*2);ctx.fill();
    // Jagged bolt from above
    ctx.strokeStyle=hasThunderWrath?'#fff':'#ff0';
    ctx.lineWidth=hasThunderWrath?5:4;
    ctx.shadowColor=hasThunderWrath?'#fff':'#ff0';ctx.shadowBlur=hasThunderWrath?20:10;
    ctx.beginPath();
    const startY=l.y-(hasThunderWrath?420:280);
    let bx=l.x+rnd(-5,5),by=startY;ctx.moveTo(bx,by);
    const segs=hasThunderWrath?12:8;
    for(let s=0;s<segs;s++){
      const t=(s+1)/segs;
      const tx=l.x+rnd(-30,30);
      const ty=startY+(l.y-startY)*t;
      ctx.lineTo(tx,ty);
    }
    ctx.lineTo(l.x,l.y);ctx.stroke();
    if(hasThunderWrath){
      // Side branches
      ctx.lineWidth=2;
      for(let br=0;br<3;br++){
        ctx.beginPath();let bx2=l.x,by2=l.y;
        ctx.moveTo(bx2,by2);
        for(let s=0;s<4;s++){bx2+=rnd(-25,25);by2+=rnd(-25,25);ctx.lineTo(bx2,by2);}
        ctx.stroke();
      }
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  // ThunderWrath full-screen flash on each strike
  if(hasThunderWrath){
    let active=0;for(const l of lightningFx)if(!l.kind&&l.life>l.maxLife*0.8)active++;
    if(active>0){ctx.fillStyle=`rgba(255,255,180,${Math.min(0.25,active*0.05)})`;ctx.fillRect(camera.x,camera.y,W,H);}
  }

  for(const e of enemies)drawEnemy(e);

  // Death animations: scale up + fade out
  for(const d of deadFx){
    const t=1-d.life/d.maxLife;
    const sz=d.radius*2.6*(1+t*0.6);
    const sp=SPRITES[d.sprite];
    ctx.globalAlpha=1-t;
    if(sp){ctx.drawImage(sp,d.x-sz/2,d.y-sz/2,sz,sz);}
    else{ctx.fillStyle=d.color||'#aaa';ctx.beginPath();ctx.arc(d.x,d.y,d.radius*(1+t*0.6),0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  }

  // Death
  if(deathEntity){
    const d=deathEntity;
    ctx.fillStyle='#000';ctx.shadowColor='#808';ctx.shadowBlur=30;
    ctx.beginPath();ctx.arc(d.x,d.y,d.radius,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#202';ctx.beginPath();ctx.arc(d.x,d.y-5,d.radius*.85,Math.PI,0);ctx.fill();
    ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(d.x-9,d.y-5,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(d.x+9,d.y-5,5,0,Math.PI*2);ctx.fill();
    // ☠ symbol
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('☠',d.x,d.y+10);
    ctx.fillStyle='#f00';ctx.font='bold 14px monospace';
    ctx.fillText('DEATH',d.x,d.y+d.radius+18);
  }

  // Pet
  if(save.pets[save.selectedPet]&&save.pets[save.selectedPet].unlocked){
    const pi=PET_DEFS[save.selectedPet];
    const sp=SPRITES['pet_'+save.selectedPet];
    const py2=pet.y-(pet.vy||0);
    if(sp){
      const sz=32;
      ctx.drawImage(sp,pet.x-sz/2,py2-sz/2,sz,sz);
    } else {
      ctx.font='24px serif';ctx.textAlign='center';
      ctx.fillText(pi.icon,pet.x,py2+8);
    }
  }

  drawPlayer();

  for(const p of dmgPopups){
    ctx.globalAlpha=Math.min(1,p.life/p.maxLife*1.5);
    ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(p.text,p.x,p.y);
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.restore();

  drawHUD();
  // Level-up gold flash overlay
  if(levelUpFlash>0){
    const a=Math.min(1,levelUpFlash/0.6)*0.6;
    ctx.fillStyle=`rgba(255,200,0,${a})`;ctx.fillRect(0,0,W,H);
    // Expanding ring near player
    ctx.save();ctx.translate(-camera.x,-camera.y);
    const r=(0.6-levelUpFlash)*180;
    ctx.strokeStyle=`rgba(255,230,80,${a*1.5})`;ctx.lineWidth=8;
    ctx.beginPath();ctx.arc(player.x,player.y,r,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  if(bState==='levelup')drawLevelUp2();
  if(bState==='chest')drawChest2();
  if(bState==='paused')drawPaused2();
}

function drawHUD(){
  const SL=94;
  // HP
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(SL+5,10,210,22);
  ctx.fillStyle='#222';ctx.fillRect(SL+7,12,206,18);
  const hpR=player.hp/player.maxHp;
  ctx.fillStyle=hpR>.5?'#4f4':hpR>.25?'#fa0':'#f44';
  ctx.fillRect(SL+7,12,206*hpR,18);
  ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText(`❤ ${Math.ceil(player.hp)}/${player.maxHp}`,SL+110,26);

  const mins=Math.floor(gameTime/60),secs=Math.floor(gameTime%60);
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(W/2-65,8,130,28);
  ctx.fillStyle='#fff';ctx.font='bold 18px monospace';
  ctx.fillText(`⏱ ${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`,W/2,28);

  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(W/2-130,8,60,28);
  ctx.fillStyle='#ff0';ctx.font='bold 15px monospace';
  ctx.fillText(`Lv${player.level}`,W/2-100,28);

  // Top right gold + kills (boxed)
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(W-180,8,170,28);
  ctx.strokeStyle='#fa0';ctx.lineWidth=1;ctx.strokeRect(W-180,8,170,28);
  ctx.fillStyle='#ff0';ctx.font='bold 14px monospace';ctx.textAlign='left';
  ctx.fillText(`💰 ${runGold}`,W-172,28);
  ctx.fillStyle='#f88';ctx.fillText(`💀 ${runKills}`,W-90,28);

  // Equipment drop popups (top-right column under gold bar)
  let popY=44;
  for(const pp of equipPopups){
    const a=Math.min(1,pp.life/0.3)*Math.min(1,(pp.maxLife-pp.life+0.2)/0.3);
    ctx.globalAlpha=a;
    const px=W-260,pw=250,ph=64;
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(px,popY,pw,ph);
    ctx.strokeStyle=RANK_COLORS[pp.eq.rank];ctx.lineWidth=2;ctx.strokeRect(px+0.5,popY+0.5,pw-1,ph-1);
    ctx.fillStyle=RANK_COLORS[pp.eq.rank];ctx.font='bold 11px monospace';ctx.textAlign='left';
    ctx.fillText(`${SLOT_ICONS[pp.eq.slot]} ${RANK_NAMES[pp.eq.rank]} ${SLOT_NAMES[pp.eq.slot]}`,px+8,popY+16);
    ctx.fillStyle='#fff';ctx.font='10px monospace';
    ctx.fillText(`+${pp.newP.toFixed(1)}% ${SLOT_EFFECTS[pp.eq.slot]}`,px+8,popY+32);
    if(pp.stronger){
      ctx.fillStyle='#0f0';ctx.font='bold 10px monospace';
      ctx.fillText(`↑ +${(pp.newP-pp.oldP).toFixed(1)}% UP`,px+8,popY+48);
    } else if(pp.oldP>0){
      ctx.fillStyle='#888';ctx.font='10px monospace';
      ctx.fillText(`(equipped: +${pp.oldP.toFixed(1)}%)`,px+8,popY+48);
    } else {
      ctx.fillStyle='#0af';ctx.font='10px monospace';
      ctx.fillText(`(slot empty)`,px+8,popY+48);
    }
    popY+=ph+6;
  }
  ctx.globalAlpha=1;

  // XP gradient bar
  const xpBarW=W-SL-15;
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(SL+3,H-30,xpBarW,20);
  ctx.fillStyle='#222';ctx.fillRect(SL+5,H-28,xpBarW-2,16);
  const xpGrad=ctx.createLinearGradient(SL+5,H-28,SL+5+xpBarW,H-28);
  xpGrad.addColorStop(0,'#08f');xpGrad.addColorStop(1,'#0ff');
  ctx.fillStyle=xpGrad;ctx.fillRect(SL+5,H-28,(xpBarW-2)*(player.xp/player.xpToNext),16);
  ctx.fillStyle='#fff';ctx.font='10px monospace';ctx.textAlign='center';
  ctx.fillText(`XP ${player.xp} / ${player.xpToNext}`,(SL+5+W-15)/2,H-17);

  // Boss HP
  if(bossActive&&bossActive.hp>0){
    ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(W/2-200,40,400,24);
    ctx.fillStyle='#222';ctx.fillRect(W/2-198,42,396,20);
    const r=bossActive.hp/bossActive.maxHp;
    let bossColor=bossActive.color;
    if(bossActive.rainbow)bossColor=`hsl(${(gameTime*120)%360},100%,55%)`;
    ctx.fillStyle=bossColor;ctx.fillRect(W/2-198,42,396*r,20);
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(`👑 ${bossActive.bossName} ${Math.ceil(bossActive.hp)}/${Math.ceil(bossActive.maxHp)}`,W/2,57);
  }

  // Reset flash
  if(resetFlash>0){
    const a=Math.min(1,resetFlash);
    ctx.fillStyle=`rgba(255,68,68,${a*0.18})`;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px monospace';ctx.textAlign='center';
    ctx.shadowColor='#f44';ctx.shadowBlur=20;
    ctx.fillText('⚡ SKILL RESET! ⚡',W/2,H/2);ctx.shadowBlur=0;
  }
  // Boss victory fanfare
  if(bossVictoryT>0){
    const t=1-bossVictoryT/2.0;
    const a=Math.sin(t*Math.PI)*0.85;
    ctx.fillStyle=`rgba(255,200,0,${a*0.45})`;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font=`bold ${48+t*30}px monospace`;ctx.textAlign='center';
    ctx.shadowColor='#fa0';ctx.shadowBlur=40;
    ctx.fillText('⚡ BOSS DEFEATED! ⚡',W/2,H/2);
    ctx.shadowBlur=0;
  }
  // Wave text
  if(waveTimer>0){
    ctx.globalAlpha=Math.min(1,waveTimer);
    const txtW=ctx.measureText(waveText).width;
    ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(W/2-180,75,360,34);
    ctx.fillStyle='#f44';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText(waveText,W/2,99);
    ctx.globalAlpha=1;
  }
  // Death warning
  if(deathWarnTimer>0&&!deathEntity){
    const a=.5+Math.sin(Date.now()/130)*.5;
    ctx.globalAlpha=a;
    ctx.fillStyle='#f00';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText(`⚠️ DEATH APPROACHES IN ${Math.ceil(deathWarnTimer)}s ⚠️`,W/2,H/2-100);
    ctx.globalAlpha=1;
  }

  // Evolution ready banner
  if(evolutionReady()){
    const a=.6+Math.sin(gameTime*5)*.4;
    ctx.fillStyle=`rgba(255,200,0,${a*0.95})`;
    ctx.fillRect(W/2-200,H-70,400,28);
    ctx.fillStyle='#000';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText('⚡ EVOLVE READY! Level up to fuse the skill ⚡',W/2,H-51);
  }

  // Left panel: MAIN WEAPON / SUB SKILLS / PASSIVE
  const px2=2,slH=30,slW=98;
  const drawSlot=(y,w,evolveAcc)=>{
    if(!w){ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(px2+3,y,slW-6,slH-3);return;}
    const d=WEAPON_DEFS[w.id];if(!d)return;
    ctx.fillStyle=d.color;ctx.globalAlpha=.25;ctx.fillRect(px2+3,y,slW-6,slH-3);ctx.globalAlpha=1;
    if(d.evolved){ctx.strokeStyle='#fa0';ctx.lineWidth=2;ctx.shadowColor='#fa0';ctx.shadowBlur=8;}
    else{ctx.strokeStyle=d.color;ctx.lineWidth=1;}
    ctx.strokeRect(px2+3,y,slW-6,slH-3);ctx.shadowBlur=0;
    const sp=d.sprite&&SPRITES[d.sprite];
    if(sp){
      if(d.tier==='S'){ctx.shadowColor='#fc0';ctx.shadowBlur=10;}
      ctx.drawImage(sp,px2+4,y+2,26,26);ctx.shadowBlur=0;
      if(d.tier==='S'){ctx.fillStyle='#fc0';ctx.fillRect(px2+22,y+2,8,8);ctx.fillStyle='#000';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('S',px2+26,y+8);}
    } else {ctx.font='18px serif';ctx.textAlign='left';ctx.fillText(d.icon,px2+6,y+22);}
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='left';ctx.fillText(d.name.slice(0,10),px2+32,y+12);
    if(d.evolved){ctx.fillStyle='#fa0';ctx.font='bold 9px monospace';ctx.fillText('★EVOLVED',px2+32,y+24);}
    else{ctx.font='bold 10px monospace';ctx.fillStyle='#fc0';ctx.fillText('★'.repeat(w.lv)+'☆'.repeat(5-w.lv),px2+32,y+25);}
  };
  // MAIN WEAPON section (1 slot)
  const py2=8;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(px2,py2,slW,slH+22);
  ctx.fillStyle='#fc0';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('⚔ MAIN WEAPON',px2+5,py2+12);
  const mainW=player.weapons.find(w=>w.id===player.mainWeaponId);
  drawSlot(py2+16,mainW,null);
  // SUB SKILLS section (6 slots)
  const subY=py2+slH+22+6;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(px2,subY-6,slW,6*slH+22);
  ctx.fillStyle='#ff0';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('✦ SUB SKILLS',px2+5,subY+5);
  const subSkills=player.weapons.filter(w=>w.id!==player.mainWeaponId);
  for(let i=0;i<6;i++)drawSlot(subY+10+i*slH,subSkills[i]);
  // PASSIVE section (6 slots)
  const psY=subY+10+6*slH+6;
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(px2,psY-6,slW,6*slH+22);
  ctx.fillStyle='#0ff';ctx.font='bold 9px monospace';ctx.textAlign='left';ctx.fillText('✧ PASSIVE',px2+5,psY+5);
  for(let i=0;i<6;i++){
    const y=psY+10+i*slH;const p=player.passives[i];
    if(p){const d=PASSIVE_DEFS[p.id];if(!d){ctx.strokeStyle='#333';ctx.strokeRect(px2+3,y,slW-6,slH-3);continue;}
      ctx.fillStyle=d.color;ctx.globalAlpha=.22;ctx.fillRect(px2+3,y,slW-6,slH-3);ctx.globalAlpha=1;
      ctx.strokeStyle=d.color;ctx.lineWidth=1;ctx.strokeRect(px2+3,y,slW-6,slH-3);
      ctx.font='16px serif';ctx.textAlign='left';ctx.fillStyle='#fff';ctx.fillText(d.icon,px2+6,y+18);
      ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.fillText(d.name.slice(0,10),px2+25,y+12);
      if(d.evolveTarget){const td=WEAPON_DEFS[d.evolveTarget];const tw=getW(d.evolveTarget);
        ctx.fillStyle=tw&&tw.lv>=5?'#fa0':'#aaa';ctx.font='8px monospace';
        if(td)ctx.fillText(`→${td.name.slice(0,6)}`,px2+25,y+25);
      }
    } else {ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.strokeRect(px2+3,y,slW-6,slH-3);}
  }
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='8px monospace';ctx.textAlign='right';ctx.fillText('ESC=Pause',W-6,H-5);
  drawMinimap();
}

function drawMinimap(){
  const MM=120,MX=W-MM-12,MY=H-MM-50;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(MX,MY,MM,MM);
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(MX+0.5,MY+0.5,MM-1,MM-1);
  const range=600;const scale=MM/(range*2);
  // Enemies
  for(const e of enemies){
    const dx=e.x-player.x,dy=e.y-player.y;
    if(Math.abs(dx)>range||Math.abs(dy)>range)continue;
    ctx.fillStyle=e.isBoss?'#ff0':'#f44';
    const sz=e.isBoss?3:1.5;
    ctx.fillRect(MX+MM/2+dx*scale-sz/2,MY+MM/2+dy*scale-sz/2,sz,sz);
  }
  // Player center
  ctx.fillStyle='#fff';ctx.fillRect(MX+MM/2-2,MY+MM/2-2,4,4);
  // Death entity
  if(deathEntity){
    const dx=deathEntity.x-player.x,dy=deathEntity.y-player.y;
    const ax=Math.max(-range,Math.min(range,dx));
    const ay=Math.max(-range,Math.min(range,dy));
    ctx.fillStyle='#a0f';ctx.beginPath();ctx.arc(MX+MM/2+ax*scale,MY+MM/2+ay*scale,3,0,Math.PI*2);ctx.fill();
  }
}

function drawLevelUp2(){
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  // Single evolve card?
  if(levelUpChoices.length===1&&levelUpChoices[0].evolve){
    const c=levelUpChoices[0];
    // Pulsing gold bg
    const pulse=0.5+Math.sin(gameTime*4)*0.5;
    ctx.fillStyle=`rgba(255,200,0,${0.2+pulse*0.15})`;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fa0';ctx.font='bold 50px monospace';ctx.textAlign='center';
    ctx.shadowColor='#fa0';ctx.shadowBlur=30;
    ctx.fillText('⚡ EVOLVE! ⚡',W/2,90);ctx.shadowBlur=0;
    const bx=W/2-180,by=130,bw=360,bh=420;
    ctx.fillStyle='rgba(80,40,0,.95)';ctx.strokeStyle='#fa0';ctx.lineWidth=4;
    ctx.shadowColor='#fa0';ctx.shadowBlur=24;
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,16);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.font='80px serif';ctx.fillStyle='#fff';ctx.fillText(c.icon||'?',W/2,by+130);
    ctx.fillStyle=c.color;ctx.font='bold 28px monospace';ctx.fillText(c.name,W/2,by+200);
    ctx.fillStyle='#fff';ctx.font='13px monospace';wrapTx(c.desc,W/2,by+250,bw-30,18);
    ctx.fillStyle='#fa0';ctx.font='bold 16px monospace';ctx.globalAlpha=.6+pulse*.4;
    ctx.fillText('TAP / 1 to evolve',W/2,by+bh-30);ctx.globalAlpha=1;
    return;
  }
  ctx.fillStyle='#ff0';ctx.font='bold 32px monospace';ctx.textAlign='center';
  ctx.fillText('★ LEVEL UP! ★',W/2,80);
  ctx.fillStyle='#ccc';ctx.font='12px monospace';ctx.fillText('Press 1 / 2 / 3 or click',W/2,105);
  if(pendingLvl>0){ctx.fillStyle='#fa0';ctx.font='11px monospace';ctx.fillText(`+${pendingLvl} more pending`,W/2,123);}
  for(let i=0;i<levelUpChoices.length;i++){
    const c=levelUpChoices[i];const bx=W/2-265+i*185,by=145,bw=165,bh=300;
    const hov=selectedChoice===i;
    // Detect S-rank weapon for special bg/border
    const isSWeapon=c.type==='weapon'&&c.sprite&&(c.sprite.endsWith('_s')||c.sprite==='weapon_chaos');
    // Type bg colors (S-weapon uses dark gold)
    const typeBg=isSWeapon?'rgba(42,26,0,.95)':{weapon:'rgba(42,10,10,.95)',passive:'rgba(20,30,80,.95)',heal:'rgba(20,60,20,.95)',evolve:'rgba(80,40,0,.95)'}[c.type]||'rgba(35,35,65,.95)';
    ctx.fillStyle=hov?'rgba(100,180,255,.4)':typeBg;
    ctx.strokeStyle=hov?'#4af':isSWeapon?'#fc0':c.color||'#444';ctx.lineWidth=isSWeapon?3:2;
    if(isSWeapon){ctx.shadowColor='#fa0';ctx.shadowBlur=14;}
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle=c.type==='weapon'?'#f80':c.type==='passive'?'#0af':'#4f4';
    ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(c.tag,bx+bw/2,by+18);
    ctx.fillStyle='#ff0';ctx.font='bold 22px monospace';ctx.fillText(i+1+'',bx+bw/2,by+44);
    // Top-left 32x32 sprite (per spec); large 52x52 centered if no sprite available
    const sp=c.sprite&&SPRITES[c.sprite];
    if(sp){
      // Top-left thumbnail
      if(isSWeapon){ctx.shadowColor='#fc0';ctx.shadowBlur=10;}
      ctx.drawImage(sp,bx+8,by+8,32,32);
      ctx.shadowBlur=0;
      // Large centered icon
      ctx.drawImage(sp,bx+bw/2-26,by+60,52,52);
      // S badge top-right
      if(isSWeapon){
        ctx.fillStyle='#fc0';ctx.fillRect(bx+bw-22,by+8,16,16);
        ctx.fillStyle='#000';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('S',bx+bw-14,by+20);
      }
    }
    else{ctx.font='44px serif';ctx.fillText(c.icon||'?',bx+bw/2,by+108);}
    ctx.fillStyle=c.color;ctx.fillRect(bx+18,by+125,bw-36,3);
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';wrapTx(c.name,bx+bw/2,by+148,bw-14,16);
    // ★ display for weapon UP
    if(c.type==='weapon'&&c.star){
      ctx.fillStyle='#fc0';ctx.font='bold 16px monospace';
      ctx.fillText('★'.repeat(c.star)+'☆'.repeat(5-c.star),bx+bw/2,by+178);
    }
    ctx.fillStyle='#aaa';ctx.font='11px monospace';wrapTx(c.desc,bx+bw/2,by+200,bw-14,14);
    // Evolve hint for aux
    if(c.type==='passive'&&c.evolveTarget){
      const td=WEAPON_DEFS[c.evolveTarget];
      ctx.fillStyle='#fa0';ctx.font='bold 10px monospace';
      ctx.fillText(`⚡ EVO: ${td.icon} ${td.name}`,bx+bw/2,by+bh-18);
    }
  }
}
function drawChest2(){
  // No longer used (evolution flows via level-up)
  bState='playing';
}
function drawPaused2(){
  ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 32px monospace';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,90);
  let y=130;
  ctx.fillStyle='#ff0';ctx.font='bold 13px monospace';ctx.fillText('-- ATTACK SKILLS --',W/2,y);y+=20;
  for(const w of player.weapons){const d=WEAPON_DEFS[w.id];ctx.fillStyle=d.color;ctx.font='12px monospace';ctx.fillText(`${d.icon} ${d.name} ${d.evolved?'★EVO':'★'.repeat(w.lv)}`,W/2,y);y+=18;}
  y+=8;ctx.fillStyle='#0ff';ctx.font='bold 13px monospace';ctx.fillText('-- AUX --',W/2,y);y+=20;
  for(const p of player.passives){const d=PASSIVE_DEFS[p.id];ctx.fillStyle=d.color;ctx.font='12px monospace';ctx.fillText(`${d.icon} ${d.name}`,W/2,y);y+=18;}
  y+=8;ctx.fillStyle='#fa0';ctx.font='bold 13px monospace';ctx.fillText('-- STATS --',W/2,y);y+=20;
  ctx.fillStyle='#fff';ctx.font='12px monospace';
  ctx.fillText(`ATK x${player.might.toFixed(2)}  Crit ${player.critRate}%  CD -${(player.cdReduction*100).toFixed(0)}%`,W/2,y);y+=18;
  ctx.fillText(`Speed ${Math.round(player.speed)}  Magnet ${Math.round(player.magnetRange)}`,W/2,y);
  // Pause buttons (rendered at fixed canvas-space positions; click handler uses these rects)
  const cx=W/2;
  const muteY=H-200,homeY=H-140,resY=H-80;
  const drawBtn=(label,by,fill)=>{
    ctx.fillStyle=fill;ctx.fillRect(cx-110,by-26,220,40);
    ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(label,cx,by+1);
  };
  drawBtn(`BGM: ${AUDIO.muted?'OFF 🔇':'ON 🔊'}`,muteY,'#26467a');
  drawBtn('🏠 Return Home',homeY,'#a02020');
  drawBtn('▶ Resume (ESC)',resY,'#208040');
  // Store rects globally for click hit-test
  pauseBtnRects=[
    {y:muteY,a:'mute'},
    {y:homeY,a:'home'},
    {y:resY,a:'resume'},
  ];
}
let pauseBtnRects=[];
function wrapTx(t,x,y,mw,lh){const w=t.split(' ');let l='',ty=y;for(const wd of w){const ts=l+wd+' ';if(ctx.measureText(ts).width>mw&&l!==''){ctx.fillText(l.trim(),x,ty);l=wd+' ';ty+=lh;}else l=ts;}ctx.fillText(l.trim(),x,ty);}

window.addEventListener('keydown',e=>{
  if(bState==='playing'&&e.key==='Escape')bState='paused';
  else if(bState==='paused'&&e.key==='Escape')bState='playing';
  else if(bState==='levelup'){
    if(e.key>='1'&&e.key<='3'){const i=+e.key-1;if(i<levelUpChoices.length){levelUpChoices[i].apply();if(pendingLvl>0){pendingLvl--;pickChoices();}else bState='playing';}}
  }else if(bState==='chest'){if(e.key===' '||e.key==='Enter')bState='playing';}
});

canvas2.addEventListener('click',e=>{
  const rect=canvas2.getBoundingClientRect();const sx=W/rect.width,sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  if(bState==='levelup'){
    for(let i=0;i<levelUpChoices.length;i++){const bx=W/2-265+i*185,by=175;
      if(mx>=bx&&mx<=bx+165&&my>=by&&my<=by+240){levelUpChoices[i].apply();if(pendingLvl>0){pendingLvl--;pickChoices();}else bState='playing';break;}}
  }else if(bState==='chest')bState='playing';
  else if(bState==='paused'){
    const cx=W/2;
    for(const r of pauseBtnRects){
      if(mx>=cx-110&&mx<=cx+110&&my>=r.y-26&&my<=r.y+14){
        if(r.a==='mute')audioToggleMute();
        else if(r.a==='resume')bState='playing';
        else if(r.a==='home'){bgmStop();bState='done';
          document.getElementById('battle').classList.remove('active');
          document.getElementById('joystickArea').style.display='none';
          document.getElementById('muteBtn').style.display='none';
          showHome();
        }
        return;
      }
    }
  }
});
canvas2.addEventListener('mousemove',e=>{
  if(bState!=='levelup')return;
  const rect=canvas2.getBoundingClientRect();const sx=W/rect.width,sy=H/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  selectedChoice=-1;
  for(let i=0;i<levelUpChoices.length;i++){const bx=W/2-265+i*185,by=175;if(mx>=bx&&mx<=bx+165&&my>=by&&my<=by+240){selectedChoice=i;break;}}
});

function battleLoop(ts){
  if(bState==='done')return;
  if(lastTs===0)lastTs=ts;
  dt2=Math.min((ts-lastTs)/1000,.05);lastTs=ts;
  updateBattle();drawBattle();
  requestAnimationFrame(battleLoop);
}

function endBattle(cleared,bossWin){
  save.coins+=runGold;
  save.records.totalKills+=runKills;
  if(player.level>save.records.highestLevel)save.records.highestLevel=player.level;
  if(gameTime>save.records.longestSurvival)save.records.longestSurvival=gameTime;
  dailyProgress('kills',runKills);
  // Survive3: track best run survived seconds (use max instead of accumulate)
  checkDaily();
  if(gameTime>(save.daily.progress.survive3||0))save.daily.progress.survive3=Math.floor(gameTime);
  if(runLevelUps>(save.daily.progress.levelup5||0))save.daily.progress.levelup5=runLevelUps;

  let bonusGold=0;
  if(cleared){
    const chap=CHAPTER_DEFS[save.selectedChapter];
    if(!save.chapters[save.selectedChapter].cleared){
      bonusGold=chap.clearReward||0;
      save.coins+=bonusGold;
      // Unlock next chapter for free? No, costs coins
    } else {
      bonusGold=Math.floor((chap.clearReward||0)*0.3);
      save.coins+=bonusGold;
    }
    save.chapters[save.selectedChapter].cleared=true;
    if(!save.records.chaptersCleared)save.records.chaptersCleared={};
    save.records.chaptersCleared[save.selectedChapter]=true;
    // 30 min clear: golden equipment
    if(gameTime>=1800){
      const slots=Object.keys(SLOT_NAMES);const sl=slots[Math.floor(Math.random()*slots.length)];
      if(save.equipment.length<50){const id=makeEquip(sl,'gold');runEquipsDropped.push(save.equipment.find(e=>e.id===id));}
    }
  }
  // Check achievements
  const ac=checkAchievements();
  saveSave();

  bgmStop();
  if(!cleared)SFX.death();
  document.getElementById('battle').classList.remove('active');
  document.getElementById('joystickArea').style.display='none';
  document.getElementById('muteBtn').style.display='none';
  showResult(cleared,bonusGold,ac,bossWin);
}

function showResult(cleared,bonusGold,achievementsClaimed,bossWin){
  const r=document.getElementById('result');r.classList.add('active');
  r.classList.remove('clear-bg','gameover-bg');
  r.classList.add(cleared?'clear-bg':'gameover-bg');
  const mins=Math.floor(gameTime/60),secs=Math.floor(gameTime%60);
  const timeStr=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  let dropHtml='';
  if(runEquipsDropped.length>0){
    dropHtml='<div style="margin-top:14px"><div style="color:#fa0;font-weight:bold;margin-bottom:6px">📦 Equipment Dropped</div><div class="dropped-eq" style="max-width:520px;margin:0 auto">';
    for(const eq of runEquipsDropped){
      const cur=getEqById(save.equipped[eq.slot]);
      const newP=eqBonusPct(eq);
      const oldP=cur?eqBonusPct(cur):0;
      const stronger=newP>oldP;
      dropHtml+=`<div class="equip-slot rank-${eq.rank}" title="+${newP.toFixed(1)}% ${SLOT_EFFECTS[eq.slot]}" style="position:relative;width:74px;height:84px">
        <div class="eq-icon">${SLOT_ICONS[eq.slot]}</div>
        <div style="font-size:8px;color:${RANK_COLORS[eq.rank]};font-weight:bold">${eqLabel(eq)}</div>
        <div style="font-size:8px;color:#0f0">+${newP.toFixed(1)}%</div>
        ${stronger?'<div style="position:absolute;top:-7px;right:-7px;background:#f22;color:#fff;font-size:9px;padding:2px 5px;border-radius:8px;font-weight:bold;animation:red-pulse 1.4s infinite">🔺UP</div>':''}
      </div>`;
    }
    dropHtml+='</div></div>';
  }
  const frameCls=cleared?'result-clear':'result-over';
  const titleColor=cleared?'#fc0':'#f44';
  const titleText=bossWin?'⚡ VICTORY! ⚡':cleared?'🎉 STAGE CLEAR! 🎉':'💀 GAME OVER 💀';
  r.innerHTML=`<div class="result-box ${frameCls}">
    <h2 style="color:${titleColor};text-shadow:0 0 18px ${titleColor}">${titleText}</h2>
    <div class="stat-row"><span>⏱ Survived</span><span class="number-up">${timeStr}</span></div>
    <div class="stat-row"><span>★ Level Reached</span><span class="number-up">${player.level}</span></div>
    <div class="stat-row"><span>💀 Kills</span><span class="number-up">${runKills}</span></div>
    <div class="stat-row"><span>💰 Gold Earned</span><span class="number-up">${runGold}</span></div>
    ${bonusGold>0?`<div class="stat-row"><span>🏆 Clear Bonus</span><span class="number-up">+${bonusGold}</span></div>`:''}
    ${achievementsClaimed>0?`<div class="stat-row"><span>🏅 Achievements</span><span style="color:#0f0">+${achievementsClaimed}!</span></div>`:''}
    <div class="stat-row"><span>💼 Total Gold</span><span style="color:#fc0">${save.coins}</span></div>
    ${dropHtml}
    <div class="result-btns">
      <button class="btn btn-blue" onclick="goEquip()">🛡 Equipment</button>
      <button class="btn btn-purple" onclick="goGacha()">🎰 Gacha</button>
      <button class="btn btn-orange" onclick="goHome()">🏠 Home</button>
      <button class="btn btn-green" onclick="retry()">↻ Retry</button>
    </div>
  </div>`;
  if(cleared)spawnConfetti(70);
}

function spawnConfetti(n){
  const colors=['#fc0','#f44','#4f4','#4af','#a4f','#fff','#f8a'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2+Math.random()*2.5)+'s';
    p.style.animationDelay=(Math.random()*0.6)+'s';
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),5000);
  }
}

function _leaveResult(){const r=document.getElementById('result');r.classList.remove('active','clear-bg','gameover-bg');}
window.goEquip=function(){_leaveResult();currentTab='Equipment';showHome();};
window.goGacha=function(){_leaveResult();currentTab='Gacha';showHome();};
window.goHome=function(){_leaveResult();showHome();};
window.retry=function(){_leaveResult();startBattle();};

// Init
checkAchievements();
// Show loading screen on home initially
document.getElementById('homePanel').innerHTML='<div style="text-align:center;padding:60px;color:#fa0;font-size:18px">⏳ Loading sprites... <span id="loadProg">0</span>/'+spritesTotal+'</div>';
const loadProgEl=()=>document.getElementById('loadProg');
const origLoad=preloadSprites;
let _origCb;
preloadSprites=function(cb){
  _origCb=cb;
  for(const[k,src]of Object.entries(SPRITE_FILES)){
    const img=new Image();
    img.onload=()=>{SPRITES[k]=img;spritesLoaded++;const el=loadProgEl();if(el)el.textContent=spritesLoaded;if(spritesLoaded===spritesTotal)cb();};
    img.onerror=()=>{SPRITES[k]=null;spritesLoaded++;const el=loadProgEl();if(el)el.textContent=spritesLoaded;if(spritesLoaded===spritesTotal)cb();};
    img.src=src;
  }
};
preloadSprites(()=>{showHome();});
</script>
